# pheasant demo — microsoft/agent-framework, OpenAI embeddings, agentic chat
#
#   docker compose -f docker-compose.yml -f examples/demo-agent-framework/docker-compose.demo.yml up -d --build
#
# What this config turns on that the default example does not:
#   * search.embeddings — chunks are embedded through OpenAI at sync time, so
#     search gains mode=vector and hybrid gets semantic candidates.
#   * assistant.workflow: agentic — the LangGraph loop (plan → retrieve →
#     expand → grade → synthesize → verify) summarizes results, instead of a
#     single-pass call.
#   * one source: a local clone of https://github.com/microsoft/agent-framework
#     mounted read-only at /workspace.
#
# Secrets: this file names ENV VARS ONLY. The key itself lives in the .env file
# beside docker-compose (see .env.demo.example) and never lands in config, in
# /state, in the image, or in logs.

pheasant:
  name: agent-framework-demo
  description: microsoft/agent-framework indexed with OpenAI embeddings and agentic chat
  environment: local
  log_level: INFO
  state_path: /state
  workspace_root: /workspace
  exports_path: /exports

server:
  host: 0.0.0.0
  port: 8765
  mcp:
    enabled: true
    transports:
      stdio: true
      streamable_http: true
      sse: false
  api:
    enabled: true
    openapi: true
  ui:
    enabled: true
    graph_visualization: true

storage:
  graph_format: node_link_json
  graph_snapshots: true
  graph_snapshot_interval_seconds: 900
  # How often an in-progress sync writes graph.latest.json. The graph used to
  # reach disk only when a sync *finished*, so stopping the container during a
  # long first index threw that work away and the next start had to rebuild it.
  # 0 = save at end of sync only.
  graph_checkpoint_seconds: 60
  compression: zstd
  max_state_size_gb: 10

# --- Phase 34.5: WASM-accelerated hot loops -------------------------------
# Both opt-in, both default off elsewhere. agent-framework is a real,
# large, multi-language repo — the corpus this demo exists to exercise at
# realistic scale — so it is the natural place to turn these on: needs the
# `wasm` extra above (PHEASANT_EXTRAS), falls back to pure Python on any
# failure either way.
graph:
  wasm_cross_source_resolution: true

search:
  default_mode: hybrid
  wasm_relationship_search: true
  keyword:
    enabled: true
    engine: sqlite_fts5

  # --- INDEX COMPONENT: OpenAI embeddings ---------------------------------
  # The one sanctioned network call in the indexing path. Re-syncing unchanged
  # content still re-embeds nothing: the pre-read sha256 skip means an
  # unchanged file never reaches the embedder, so cost tracks real changes.
  embeddings:
    enabled: true
    provider: openai-spec
    model: text-embedding-3-small
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    dimensions: 1536          # native size for -3-small; higher recall, bigger store
    batch_size: 64

  vector_store:
    # "numpy" needs nothing beyond the core deps and is plenty for one repo.
    # Switch to "lancedb" (and add `vector` to PHEASANT_EXTRAS) for a fleet.
    provider: numpy
    path: /state/vectors

  ranking:
    prefer_exact_path_matches: true
    prefer_recent_commits: true
    graph_neighbor_boost: true
    max_results_default: 10

ingestion:
  captioner:
    provider: stub
  transcriber:
    provider: stub

# This demo READS a third-party repo; nobody is editing /workspace, and
# upstream changes land daily at most. So nothing here watches for changes
# minute to minute — polling a read-only mount every 15 minutes only buys
# CPU burn. Re-check on demand any time with:
#   curl -X POST http://127.0.0.1:8765/sync/agent-framework \
#        -H 'content-type: application/json' -d '{"mode":"incremental"}'
sync:
  watcher:
    # No filesystem watch: the mount is read-only and nothing local changes it.
    enabled: false
  git:
    enabled: true
    # Still notice a `git pull` in the clone, just not by polling for it.
    detect_commit_changes: true
    detect_branch_switch: true
    reindex_on_commit: true
  scheduler:
    enabled: true
    interval_seconds: 86400   # daily
  idempotency:
    hash_algorithm: sha256
    compare_size_mtime_hash: true
    skip_unchanged_files: true
  concurrency:
    max_parallel_sources: 4
    max_parallel_files: 8
    lock_timeout_seconds: 120

security:
  allow_workspace_roots:
    - /workspace
    - /exports
  allow_user_selected_source_paths: true
  read_only_sources: true
  deny_path_traversal: true
  default_exclude_secrets: true

# --- RESULT SUMMATION: chat model + agentic loop --------------------------
assistant:
  enabled: true
  provider: openai
  # Model ids are per-account. List what this key can reach with:
  #   curl -s https://api.openai.com/v1/models \
  #     -H "Authorization: Bearer $OPENAI_API_KEY" | grep -o '"id": "gpt-6[^"]*"'
  # A model the account cannot see fails with a 404 model_not_found, which the
  # chat surface reports verbatim rather than silently substituting one.
  model: gpt-6-luna
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  # A browser user can still paste their own key for their session; it stays
  # in server memory behind an opaque token.
  allow_session_keys: true
  session_key_ttl_minutes: 720
  max_context_chunks: 8
  max_output_tokens: 4096
  request_timeout_seconds: 90.0
  max_facts: 12
  # Explicitly agentic — not "auto" — so a missing [agent] extra is a loud
  # failure in the logs rather than a silent downgrade to single-pass.
  workflow: agentic
  workflow_options:
    agentic:
      max_rounds: 2
      retrieval_modes: [hybrid, vector]
      expand_graph: true
      max_context_passages: 10

sources:
  - name: agent-framework
    type: repository
    path: /workspace
    description: microsoft/agent-framework (read-only clone mounted from the host)
    enabled: true
    include:
      - "**/*.py"
      - "**/*.md"
      - "**/*.ts"
      - "**/*.js"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
    exclude:
      - "**/.git/**"
      - "**/node_modules/**"
      - "**/__pycache__/**"
      - "**/.venv/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/obj/**"
      - "**/bin/**"
      - "**/*.lock"
      - "**/package-lock.json"
      - "**/.env"
      - "**/.env.*"
      - "**/*.pem"
      - "**/*.key"
    repo:
      branch_policy: current
      include_uncommitted: true
      commit_trigger: true
      dependency_graph:
        enabled: true
        languages:
          python: true
          javascript: false
          typescript: true
    chunking:
      enabled: true
      strategy: semantic
      max_chars: 4000
      overlap_chars: 400
    sync:
      # Off, because indexing now runs in a worker process: a sync on every
      # boot means the server's graph and the worker's graph are both resident
      # at once, and on a 500k-node graph that is ~3.7GB each — more than a
      # default 8GB Docker VM has to give. Nothing is lost: the content is
      # already in /state, this repo changes daily at most, and the scheduler
      # below still picks up changes. Index on demand with:
      #   curl -X POST http://127.0.0.1:8765/sync/agent-framework \
      #        -H 'content-type: application/json' -d '{"mode":"incremental"}'
      on_startup: false
      on_file_change: none
      on_git_commit: true
      interval_seconds: 86400   # daily
