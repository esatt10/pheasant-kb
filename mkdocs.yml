site_name: pheasant
site_description: >-
  A Docker-first, local-first MCP context server that turns your sources into a
  queryable knowledge graph — and attaches to a Synapse fleet as a federated region.
site_url: https://esatt10.github.io/pheasant-kb/
repo_url: https://github.com/esatt10/pheasant-kb
repo_name: esatt10/pheasant
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Tutorials:
      - 10-minute quickstart: tutorials/quickstart.md
      - Multi-modal ingest (image + audio): tutorials/multimodal.md
  - How-to guides:
      - Set pheasant up: how-to/setup.md
      - Run the web UI (Docker Compose & CLI): how-to/run-the-ui.md
      - Ask your knowledge base (web UI): how-to/chat-and-ui.md
      - Customize the answering workflow: how-to/agent-workflows.md
      - Attach to a coding agent (MCP): how-to/attach-to-coding-agent.md
      - Agent memory: how-to/agent-memory.md
      - Configure sources: how-to/sources.md
      - Ingest PDFs & Word documents: how-to/document-ingest.md
      - Extract a taxonomy from structured documents: how-to/structured-documents.md
      - Multi-modal ingest: how-to/multimodal-ingest.md
      - Vector self-search: how-to/vector-search.md
      - Speed up indexing: how-to/indexing-performance.md
      - Monitor indexing: how-to/monitor-indexing.md
      - Running a worker fleet: how-to/worker-fleet.md
      - Separate graph-query service: how-to/graph-query-service.md
      - Architecture regression testing: how-to/architecture-regression.md
      - Capacity planning: how-to/capacity-planning.md
      - Attach to a Synapse fleet: how-to/attach-to-synapse.md
      - Export a corpus as Parquet: how-to/parquet-exports.md
      - Backup & restore: how-to/backup-restore.md
      - MCP for agents: mcp_client.md
  - Reference:
      - Configuration: configuration.md
      - Connector SDK: reference/connector-sdk.md
      - Interface matrix: reference/interfaces.md
      - HTTP API: reference/http-api.md
      - MCP tools & resources: mcp_tools.md
      - Graph model: graph_model.md
      - Parquet export schema: reference/export-schema.md
      - Security: security.md
      - Deployment: deployment.md
  - Explanation:
      - Architecture: architecture.md
      - The memory system: memory-system.md
      - Memory formation: memory-formation.md
      - Knowledge effectiveness: knowledge-effectiveness.md
      - Retrieval tuning: retrieval-tuning.md
      - Stress-test readiness: stress-test-readiness.md
      - Troubleshooting: troubleshooting.md
  - Contributor:
      - pheasant as a Synapse region (spec): SYNAPSE_INTEGRATION.md
