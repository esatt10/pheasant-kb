[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# ``pheasant`` is taken on PyPI by an unrelated project; the import root and the
# console script are still ``pheasant``.
name = "pheasant-kb"
version = "0.12.8"
description = "Docker-first MCP knowledge graph indexer and agentic retrieval layer"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "pheasant contributors" }]
dependencies = [
  "fastapi>=0.111",
  # FastAPI's lower-bound-only Starlette dependency can otherwise resolve to
  # the incompatible 1.x line, whose TestClient uses the separate httpx2
  # package. Keep the runtime and our httpx-based test tooling on the same
  # supported Starlette API until FastAPI itself supports that major version.
  "starlette<1",
  # Multipart form parsing, for POST /sources/upload. FastAPI needs it to
  # accept an UploadFile at all, and it otherwise only arrives transitively
  # through the optional [mcp] extra — so a core API route would 500 on a
  # core-only install.
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "networkx>=3.3",
  "typer>=0.12",
  "rich>=13.7",
  "watchdog>=4.0",
  "markdown-it-py>=3.0",
  "beautifulsoup4>=4.12",
  "python-docx>=1.1",
  "pymupdf>=1.24",
  "numpy>=1.26",
  "zstandard>=0.22",
  # Already pulled in transitively via fastapi/starlette; declared directly
  # because api/app.py now calls anyio.to_thread itself, to move blocking
  # work off the event loop instead of leaving it on a sync `def` route by
  # accident. Bounded to match starlette's own anyio<5,>=3.6.2.
  "anyio>=3.6.2,<5",
]

[project.optional-dependencies]
mcp = ["mcp>=2.1,<3"]
vector = ["lancedb>=0.6"]
# Phase 35.2: the Postgres state backend. Gated so a standalone region —
# which is every default install — carries no database driver and the
# offline suite runs without one.
postgres = ["psycopg[binary,pool]>=3.2"]
# Synapse 24.4: optional Ed25519 contract signing. Gated so a region that
# never sets synapse.signing_key_ref needs no crypto dep and the offline
# suite passes without it.
a2a = ["cryptography>=42.0"]
# Agentic question answering. Gated so a region that never opens the chat
# surface — or is happy with the single-pass workflow — carries no agent
# framework, and the offline suite passes without it.
agent = ["langgraph>=0.2", "langchain-core>=0.3"]
# Synapse 34.1: sandboxed (WASI) connector runtime + selective hot-loop
# acceleration. Gated so a region that never sets
# connector.runtime=sandboxed needs no wasmtime dep and the offline suite
# passes without it.
wasm = ["wasmtime>=20"]
# Phase 35.5: gRPC transport for remote preparation workers. Gated so a
# region using the default HTTP transport — which is every default install —
# carries no gRPC stack. grpcio-tools is a *runtime* dep of this extra on
# purpose: the .proto is compiled at import time rather than shipped as
# checked-in gencode, which would pin every installer to the exact protobuf
# release the stubs were generated against.
grpc = ["grpcio>=1.62", "grpcio-tools>=1.62", "protobuf>=5"]
# Phase 35.5: NATS JetStream as the index work queue, for a fleet that has
# outgrown one database. Gated because the default queue is the state store
# itself, which needs no broker — and because the queue is off entirely
# unless sync.queue.enabled is set.
queue = ["nats-py>=2.7"]
# Columnar (Parquet) exports of indexed state, plus the SQL surface over
# them (`pheasant export`). DuckDB is a read-side tool here and nothing on the
# sync path may depend on it — it is a Parquet writer and a query engine, not
# a state backend, for the reasons in src/pheasant/analytics.py. Gated because
# a region that never exports should not carry a 20 MB wheel.
analytics = ["duckdb>=1.0"]
# Exporting spans to an OTLP collector. Gated for a reason worth stating,
# because it is not the usual one: the observation plane works *without* this.
# Trace and span ids are the interaction ledger's primary key, so they cannot
# be optional and pheasant mints W3C-shaped ones itself. This extra only adds
# the exporter, and the exporter is only attached when
# observability.otlp_endpoint is set — which is why the offline suite stays
# network-free by construction rather than by mocking a collector.
otel = [
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
# Experiment tracking for the retrieval tuning plane. Gated, and the gating is
# the point rather than a size concern: `/state` is the source of truth and
# MLflow is a *mirror* of it, so a region without this extra runs every batch,
# stores every result, and loses only a dashboard. With no tracking_uri the
# sink writes a local file store under <exports>/tuning/mlruns — no server, no
# network — which is what keeps the offline suite network-free by construction
# rather than by mocking a tracking server.
tuning = ["mlflow>=2.14"]
# Documentation site (MkDocs Material). Build with: mkdocs build --strict
docs = ["mkdocs-material>=9.5"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27,<1",
  "jsonschema>=4.22",
  "ruff>=0.5",
  # Not every extra is in `dev` — lancedb, wasmtime and psycopg each want a
  # runtime or a server, so their tests skip in CI. DuckDB wants neither: it
  # is a wheel with no service behind it, so including it here is what makes
  # `tests/test_parquet_export.py` actually run on every PR instead of
  # skipping quietly, which is how an export format rots.
  "duckdb>=1.0",
]

[project.entry-points."pheasant.connectors"]
notion = "pheasant.connectors.notion:NotionConnector"
gdrive = "pheasant.connectors.gdrive:GDriveConnector"
slack = "pheasant.connectors.slack:SlackConnector"
confluence = "pheasant.connectors.confluence:ConfluenceConnector"
imap = "pheasant.connectors.imap:ImapConnector"

[project.scripts]
pheasant = "pheasant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pheasant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Fixture packages carry their own test suites (the canonical third-party
# connector shape); they run in *their* package context, not ours.
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
