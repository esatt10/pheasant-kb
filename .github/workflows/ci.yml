name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: Run ruff lint
        run: python -m ruff check src tests scripts --no-cache

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Check version alignment
        run: python scripts/sync_version.py --check

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run pytest suite
        run: python -m pytest -q

  backend-parity:
    # The scale-out backend, on EVERY pull request.
    #
    # Postgres used to be exercised only by the evaluation, memory and tuning
    # workflows, each behind a `paths:` filter -- so whether the fleet's
    # database backend got tested depended on which files a change happened to
    # touch. Measured at the time this job was added: three of the twenty-two
    # modules carrying dialect branching matched no filter at all, and one of
    # them was `sync/locks.py` -- the per-source lease, the mechanism several
    # indexers rest on, and the exact file where a `rowcount` divergence once
    # made a claim fail on SQLite and pass on Postgres.
    #
    # No `paths:` here, and the whole suite rather than a list of
    # dialect-sensitive modules: a curated list is the thing that went stale
    # the first time, and repeating it one level down would buy nothing.
    # `tests/test_workflow_coverage.py` fails if this job stops being
    # unfiltered, stops running Postgres, or stops setting the DSN.
    name: Backend parity against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pheasant
          POSTGRES_PASSWORD: pheasant
          POSTGRES_DB: pheasant_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pheasant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project, test and Postgres dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,postgres]"

      - name: Run pytest suite against Postgres
        env:
          PHEASANT_TEST_POSTGRES_DSN: postgresql://pheasant:pheasant@127.0.0.1:5432/pheasant_parity
        run: python -m pytest -q

  package-build:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: python-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

  architecture-regression:
    name: Offline five-repository architecture regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install offline benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check out sparse public regression corpora
        run: |
          python scripts/checkout_repository_corpus.py \
            --manifest benchmarks/repository-architecture-budget.json \
            --output .ci-corpus \
            --jobs 3

      - name: Run stub-only indexing and retrieval budgets
        env:
          # Defense in depth: the benchmark config also pins provider=stub and
          # assistant.provider=none. A future refactor must not discover a CI
          # secret and silently turn this into a metered/network test.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          python -m pheasant.sync.repository_benchmark \
            --manifest benchmarks/repository-architecture-budget.json \
            --repositories-root .ci-corpus \
            --output architecture-benchmark.json

      - name: Upload architecture benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-architecture-benchmark
          path: architecture-benchmark.json
          if-no-files-found: error
          retention-days: 30

  container-build:
    name: Container build and smoke tests
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - package-build
      - architecture-regression

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `compose-env` below runs the real CLI, so this job needs the package
      # installed. It used to work without one because a root sitecustomize.py
      # put src/ on sys.path for anything started from the checkout; that hack
      # was deleted with the yaml.py shim it shipped alongside, and this step
      # started failing with "No module named pheasant".
      - name: Install pheasant
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose config
        run: |
          python -m pheasant compose-env pheasant.example.yaml --output .pheasant/compose.env
          docker compose --env-file .pheasant/compose.env \
            -f deploy/compose/docker-compose.yml config --quiet
          # The advanced, scale-out and reset topologies are published artifacts too,
          # and nothing else in CI parses them. `config` resolves the image
          # references and every interpolation, so a malformed one fails here
          # rather than on a user's host. The fleet declares its four secrets
          # as required-with-no-default on purpose; placeholders satisfy the
          # parse without pretending they are usable values. Distinct
          # placeholders, because these are separate trust boundaries and a
          # serving process refuses to start when two of them match.
          PHEASANT_API_TOKEN=ci-config-check-api \
          PHEASANT_GRAPH_SERVICE_TOKEN=ci-config-check-graph \
          PHEASANT_INDEX_WORKER_TOKEN=ci-config-check-worker \
          PHEASANT_INGESTION_SERVICE_TOKEN=ci-config-check-ingestion \
          OPENAI_API_KEY=ci-config-check \
            docker compose -f deploy/compose/docker-compose.scale.yml config --quiet
          OPENAI_API_KEY=ci-config-check \
            docker compose -f deploy/compose/docker-compose.advanced.yml config --quiet
          docker compose -f deploy/compose/docker-compose.fresh.yml config --quiet
          # The CI-only topologies are published artifacts too, and each is
          # parsed by exactly one workflow. Checking them here as well means a
          # malformed service fails on every PR rather than only on the ones
          # that touch its own paths.
          docker compose -f deploy/compose/ci/docker-compose.log-tier.yml config --quiet
          docker compose -f deploy/compose/ci/docker-compose.evaluation.yml config --quiet

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pheasant:ci

      - name: Smoke test built image
        run: |
          docker run --rm pheasant:ci python -m pheasant --help
          docker run --rm pheasant:ci python -m pheasant validate /config/pheasant.yaml --no-require-paths
          docker run --rm pheasant:ci python -c "from pheasant.api.app import create_app; print(create_app(config_path='/config/pheasant.yaml').title)"
