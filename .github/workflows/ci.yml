name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Two legs, two sides of one optional extra. The image installs `agent`
      # (langgraph) by default, so `workflow: auto` runs the agentic planner /
      # grader loop in every container that has a model -- and until this leg
      # existed CI had never run it: every agentic test importorskips
      # langgraph, and nothing here installed it. 3.12 matches the image and
      # carries the extra, with PHEASANT_REQUIRE_AGENT turning "skipped" into
      # "failed" so the leg cannot go green by testing nothing. 3.11 keeps the
      # minimal install, which is the other side of the same `auto`: the
      # simple workflow a region without the extra falls back to.
      # `tests/test_workflow_coverage.py` fails if either leg goes away.
      matrix:
        include:
          - python-version: "3.11"
            extras: "dev,mcp"
            require-agent: "0"
          - python-version: "3.12"
            # `vector`: tests/test_flagship_defaults.py runs pheasant-kb's own
            # defaults (LanceDB included) on stub models.
            extras: "dev,mcp,agent,otel,grpc,vector"
            require-agent: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Run ruff lint
        run: python -m ruff check src tests scripts --no-cache

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Check version alignment
        run: python scripts/sync_version.py --check

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Check installed dependencies
        run: python -m pip check

      # The state store is PostgreSQL 17 with pg_textsearch preloaded, built
      # from deploy/postgres (the image every shipped Postgres runs). The suite
      # clones one migrated template database per test.
      # PHEASANT_REQUIRE_PG_TEXTSEARCH turns the pg_textsearch suite's skips
      # into failures, so a server that lost the extension cannot pass by
      # skipping. `tests/test_workflow_coverage.py` holds all of it.
      - name: Start PostgreSQL
        uses: ./.github/actions/pheasant-postgres
        with:
          database: pheasant_ci

      # The work queues are NATS JetStream; queue tests run against a broker.
      - name: Start NATS JetStream
        run: docker run -d --name pheasant-nats -p 127.0.0.1:14222:4222 nats:2.10-alpine -js

      - name: Run pytest suite
        env:
          PHEASANT_REQUIRE_AGENT: ${{ matrix.require-agent }}
          PHEASANT_TEST_POSTGRES_DSN: postgresql://pheasant:pheasant@127.0.0.1:5432/pheasant_ci
          PHEASANT_REQUIRE_PG_TEXTSEARCH: "1"
        run: python -m pytest -q

  mcp-app-browser:
    # The MCP App view is one HTML file whose behaviour is where an SVG ends
    # up after a drag, which no jsdom lays out. The test skips where there is
    # no Chromium (like lancedb and wasmtime elsewhere); here there is one and
    # PHEASANT_REQUIRE_BROWSER makes not finding it a failure, so this job
    # cannot go green by testing nothing.
    name: MCP App view in a real browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project, Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]" playwright
          # Chromium comes from Playwright's CDN; its system libraries are
          # already on GitHub's Ubuntu images. The apt top-up is best effort:
          # when the runners could not resolve Ubuntu's mirrors, --with-deps
          # failed every browser job before a test ran.
          python -m playwright install chromium
          python -m playwright install-deps chromium || echo "apt unreachable; using the runner's libraries"

      # Composer dictation is driven against the built web UI (a fake
      # microphone, a stand-in transcription wire), so this job builds it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the web UI
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Start PostgreSQL
        uses: ./.github/actions/pheasant-postgres
        with:
          database: pheasant_ci

      # The work queues are NATS JetStream; queue tests run against a broker.
      - name: Start NATS JetStream
        run: docker run -d --name pheasant-nats -p 127.0.0.1:14222:4222 nats:2.10-alpine -js

      - name: Run the view's browser tests
        env:
          PHEASANT_REQUIRE_BROWSER: "1"
          PHEASANT_TEST_POSTGRES_DSN: postgresql://pheasant:pheasant@127.0.0.1:5432/pheasant_ci
        run: python -m pytest tests/test_mcp_app_expand.py tests/test_dictation_browser.py -q

  package-build:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: python-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

  architecture-regression:
    name: Offline five-repository architecture regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install offline benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check out sparse public regression corpora
        run: |
          python scripts/checkout_repository_corpus.py \
            --manifest benchmarks/repository-architecture-budget.json \
            --output .ci-corpus \
            --jobs 3

      - name: Start PostgreSQL
        uses: ./.github/actions/pheasant-postgres
        with:
          database: pheasant_benchmark

      - name: Run stub-only indexing and retrieval budgets
        env:
          PHEASANT_DATABASE_URL: postgresql://pheasant:pheasant@127.0.0.1:5432/pheasant_benchmark
          # Defense in depth: the benchmark config also pins provider=stub and
          # assistant.provider=none. A future refactor must not discover a CI
          # secret and silently turn this into a metered/network test.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          python -m pheasant.sync.repository_benchmark \
            --manifest benchmarks/repository-architecture-budget.json \
            --repositories-root .ci-corpus \
            --output architecture-benchmark.json

      - name: Upload architecture benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-architecture-benchmark
          path: architecture-benchmark.json
          if-no-files-found: error
          retention-days: 30

  container-build:
    name: Container build and smoke tests
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - package-build
      - architecture-regression

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `compose-env` below runs the real CLI, so this job needs the package
      # installed. It used to work without one because a root sitecustomize.py
      # put src/ on sys.path for anything started from the checkout; that hack
      # was deleted with the yaml.py shim it shipped alongside, and this step
      # started failing with "No module named pheasant".
      - name: Install pheasant
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose config
        run: |
          # The scale-out topology is a published artifact too, and nothing
          # else in CI parses it. `config` resolves the image
          # references and every interpolation, so a malformed one fails here
          # rather than on a user's host. The fleet declares its four secrets
          # as required-with-no-default on purpose; placeholders satisfy the
          # parse without pretending they are usable values. Distinct
          # placeholders, because these are separate trust boundaries and a
          # serving process refuses to start when two of them match.
          PHEASANT_API_TOKEN=ci-config-check-api \
          PHEASANT_GRAPH_SERVICE_TOKEN=ci-config-check-graph \
          PHEASANT_INDEX_WORKER_TOKEN=ci-config-check-worker \
          PHEASANT_INGESTION_SERVICE_TOKEN=ci-config-check-ingestion \
          OPENAI_API_KEY=ci-config-check \
            docker compose -f deploy/compose/docker-compose.scale.yml config --quiet
          # pheasant-kb, the default deployment, and its on-demand tools.
          OPENAI_API_KEY=ci-config-check docker compose config --quiet
          OPENAI_API_KEY=ci-config-check docker compose --profile tools config --quiet
          # The CI-only topologies are published artifacts too, and each is
          # parsed by exactly one workflow. Checking them here as well means a
          # malformed service fails on every PR rather than only on the ones
          # that touch its own paths.
          docker compose -f deploy/compose/ci/docker-compose.log-tier.yml config --quiet
          docker compose -f deploy/compose/ci/docker-compose.evaluation.yml config --quiet

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pheasant:ci

      - name: Smoke test built image
        run: |
          docker run --rm pheasant:ci python -m pheasant --help
          docker run --rm pheasant:ci python -m pheasant validate /config/pheasant.yaml --no-require-paths
          # With nothing mounted the image writes its own config, on the
          # standalone table (one process cannot run pheasant-kb's), so the app
          # builds with no database and no key.
          docker run --rm pheasant:ci python -c "from pheasant.api.app import create_app; print(create_app(config_path='/config/pheasant.yaml').title)"
          docker run --rm pheasant:ci grep -q "defaults: standalone" /config/pheasant.yaml
