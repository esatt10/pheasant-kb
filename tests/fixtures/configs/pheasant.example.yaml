pheasant:
  name: acceptance-knowledge
  state_path: "{state_path}"
  exports_path: "{exports_path}"

sources:
  - name: pheasant-repo
    type: repository
    path: "{workspace_path}/pheasant-repo"
    branch_policy: current
    sync:
      on_startup: true
      on_file_change: debounce
      on_git_commit: true
      interval_seconds: 900

  - name: architecture-notes
    type: markdown_folder
    path: "{workspace_path}/notes/architecture"
    sync:
      on_startup: true
      on_file_change: debounce

  - name: product-documents
    type: document_folder
    path: "{workspace_path}/docs"
    include:
      - "**/*.md"
    exclude:
      - "**/.git/**"
      - "**/node_modules/**"
artifacts:
  # A save starts no background sync in the suite: each one is a child
  # process that outlives its test (one stalled CI for 30 minutes), and a
  # test that wants artifacts indexed syncs them itself.
  # tests/test_artifact_lifecycle.py drives index_on_save through a stub.
  index_on_save: false
