apiVersion: apps/v1
kind: Deployment
metadata:
  name: pheasant
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pheasant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: pheasant
          image: ghcr.io/esatt10/pheasant:0.12.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PHEASANT_CONFIG
              value: /config/pheasant.yaml
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /state
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: exports
              mountPath: /exports
          # Probe budgets are sized for a BUSY process, not just a dead one.
          # /health, /ready and /metrics are `async def` routes that answer
          # without ever needing a token from anyio's shared worker-thread
          # pool — the budget every sync HTTP route and every MCP tool call
          # actually runs on (see docs/configuration.md's "Serving
          # durability" section). This comment used to blame the GIL for a
          # busy /health; that was measured wrong (a CPU-bound handler cost
          # /health 0.33s under load, a saturated thread pool cost it 5.23s)
          # and is corrected now that the real cause is fixed. With the old
          # budget (5s timeout, 3 failures, 30s period) a genuinely healthy
          # pod under load could still be killed after ~90s of slow replies,
          # taking an in-flight sync with it — that was the probe
          # interfering with the workload it is supposed to be protecting.
          #
          # Liveness therefore still only asks "is this process gone", and
          # answers it slowly: ~5 minutes of no response before a restart.
          # A wedged process is still caught; a working one is left alone.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          # Readiness gates Service endpoints. On a single-replica deployment
          # pulling the only pod out mid-question does not shed load, it just
          # 503s the user who is waiting — so this is forgiving too, and exists
          # to cover startup rather than to react to saturation.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: pheasant-config
        - name: state
          persistentVolumeClaim:
            claimName: pheasant-state
        - name: workspace
          emptyDir: {}
        - name: exports
          persistentVolumeClaim:
            claimName: pheasant-exports
