# Produce the Parquet export on a schedule, onto the shared /exports claim.
#
# Without this the export volume is durable and shared and *empty*: a corpus is
# only extracted when someone runs the command. A CronJob is the right shape
# because an export is a batch read — it takes no lease, issues nothing but
# SELECT, and a run that fails is retried by the next one rather than needing
# recovery.
#
# It mounts /state READ-ONLY on purpose. This fleet is on Postgres, so the
# tables come from the database and /state is only read for the knowledge
# graph, which is a plain file. **On a SQLite-backed region this would not
# work**: SQLite must create its -wal/-shm sidecars even to read, so a
# read-only mount fails with "unable to open database file". A SQLite region
# runs the export where /state is writable — the single-container install, or
# `kubectl exec` into the pod that owns it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pheasant-export
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: exports
spec:
  # After the nightly index has settled. An export taken mid-sync is a valid
  # snapshot of a moving corpus — keyset pagination means no row is skipped or
  # duplicated — but a consumer comparing counts across tables would rather it
  # were not moving.
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # The export is idempotent — it replaces whole files through
      # tmp+rename — so a retry is always safe.
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pheasant
            app.kubernetes.io/component: exports
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: export
              image: ghcr.io/esatt10/pheasant:0.12.6
              imagePullPolicy: IfNotPresent
              args: ["export", "parquet", "--config", "/config/pheasant.yaml"]
              env:
                - name: PHEASANT_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: pheasant-secrets
                      key: PHEASANT_DATABASE_URL
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                # Read-only: an export never writes state. The graph is read
                # from here; the tables come from Postgres.
                - name: state
                  mountPath: /state
                  readOnly: true
                - name: exports
                  mountPath: /exports
              resources:
                requests:
                  cpu: 250m
                  # DuckDB is held to a 512 MB buffer pool and spills to disk
                  # past that, so export memory is flat in corpus size rather
                  # than proportional. This is that budget plus the graph.
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: config
              configMap:
                name: pheasant-fleet-config
            - name: state
              persistentVolumeClaim:
                claimName: pheasant-state
            - name: exports
              persistentVolumeClaim:
                claimName: pheasant-exports
