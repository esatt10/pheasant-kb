# The graph-query tier owns the published snapshot for all API replicas.
# Scale replicas for query throughput/availability; deploy one stack per
# knowledge-base shard when a single snapshot approaches its memory ceiling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pheasant-graph
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: graph
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: graph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pheasant
        app.kubernetes.io/component: graph
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: pheasant
          image: ghcr.io/esatt10/pheasant:0.12.8
          imagePullPolicy: IfNotPresent
          args: ["serve", "--role", "graph"]
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PHEASANT_CONFIG
              value: /config/pheasant.yaml
            - name: PHEASANT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pheasant-secrets
                  key: PHEASANT_API_TOKEN
            - name: PHEASANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pheasant-secrets
                  key: PHEASANT_DATABASE_URL
            - name: PHEASANT_GRAPH_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pheasant-secrets
                  key: PHEASANT_GRAPH_SERVICE_TOKEN
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /state
              readOnly: true
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: exports
              mountPath: /exports
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              # Reload briefly owns old + new generations. Size this for two
              # snapshots, not just the steady graph.
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: pheasant-fleet-config
        - name: state
          persistentVolumeClaim:
            claimName: pheasant-state
        - name: workspace
          persistentVolumeClaim:
            claimName: pheasant-workspace
        - name: exports
          persistentVolumeClaim:
            claimName: pheasant-exports
---
apiVersion: v1
kind: Service
metadata:
  name: pheasant-graph
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: graph
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: graph
  ports:
    - name: http
      port: 8765
      targetPort: http
