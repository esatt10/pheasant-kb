# Config shared by the api and indexer roles. The role itself is NOT set here
# — each workload passes `--role` on the command line, so one ConfigMap
# describes one knowledge base rather than one process.
#
# The Postgres DSN is deliberately absent: `storage.dsn_env` names an
# environment variable, and the value comes from a Secret. Only the variable's
# NAME ever appears in config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pheasant-fleet-config
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
data:
  pheasant.yaml: |
    pheasant:
      name: k8s-pheasant
      environment: kubernetes
      log_level: INFO
      state_path: /state
      workspace_root: /workspace
      exports_path: /exports
    server:
      host: 0.0.0.0
      port: 8765
      mcp:
        enabled: true
        transports:
          stdio: false
          streamable_http: true
          sse: false
      api:
        enabled: true
        openapi: true
        cors_origins:
          - http://localhost:8765
        # Replicas shed rather than queue: a fast 429 lets the Service try
        # another pod, where a slow response is just a timeout with extra
        # steps. Probe routes are never shed.
        max_concurrent_requests: 64
        # Fail readiness on SIGTERM, keep serving for 15s while endpoints
        # propagate, then shut down. Must stay under
        # terminationGracePeriodSeconds (30 below).
        drain_seconds: 15
        # Pick up a graph the indexer wrote. Ignored by roles that index.
        graph_refresh_seconds: 30
      ui:
        enabled: true
        graph_visualization: true
    storage:
      # One writer per SQLite file, and it is not one file across pods.
      backend: postgres
      dsn_env: PHEASANT_DATABASE_URL
      pool_size: 10
      graph_snapshots: true
    sync:
      # The hand-off between api (publishes) and indexer (drains).
      queue:
        enabled: true
        backend: local
        visibility_seconds: 300
        max_attempts: 3
      scheduler:
        enabled: true
        interval_seconds: 900
      watcher:
        enabled: true
      concurrency:
        max_parallel_sources: 4
        max_parallel_files: 8
        # Point the indexer at the worker Service; requests are load-balanced
        # across its endpoints, and the coordinator's circuit breakers take a
        # dead one out of rotation.
        file_executor: remote
        remote_worker_urls:
          - http://pheasant-worker:8765
        remote_worker_token_env: PHEASANT_INDEX_WORKER_TOKEN
        remote_worker_batch_size: 8
        worker_transport: http
    ingestion:
      # Manual ingestion — the UI drop zone, an agent's `ingest_submit`, the
      # readiness probe's scratch source — writes bytes before the normal
      # pipeline can index them, and the tier a browser or an agent reaches is
      # `api`, whose /state mount is readOnly because the indexer is the sole
      # writer of committed state. So the bytes are forwarded to the indexer,
      # which performs the identical local write.
      #
      # The indexer reads this same ConfigMap and ignores the setting: a
      # process that writes its own landing zone never forwards, which is what
      # keeps the tier serving this endpoint from proxying to itself.
      #
      # Headless Service, resolved to the pod. Nothing load-balances to an
      # indexer, and there is deliberately one commit authority per shard.
      landing_service_url: http://pheasant-indexer:8765
      landing_service_token_env: PHEASANT_INGESTION_SERVICE_TOKEN
    graph:
      # The API tier keeps no full graph resident. This Service can be scaled
      # independently or deployed once per knowledge-base shard.
      query_service_url: http://pheasant-graph:8765
      query_service_token_env: PHEASANT_GRAPH_SERVICE_TOKEN
      query_service_timeout_seconds: 30
    assistant:
      # Hybrid already executes lexical + vector + graph retrieval. A second
      # standalone text fanout repeats PostgreSQL ranking and largely
      # duplicates the evidence hybrid returns. Text remains an explicit API
      # mode for exact-identifier probes and remains inside hybrid.
      retrieval:
        retrieval_modes:
          - vector
          - graph
          - hybrid
    security:
      allow_workspace_roots:
        - /workspace
        - /state
      # On in the fleet, off in the single container: a replica set behind a
      # Service is a multi-tenant surface by construction. `public` keeps
      # un-ACL'd content searchable, so this adds enforcement without
      # requiring every artifact to carry an ACL first.
      acl_enforced: true
      default_visibility: public
      api_auth:
        # PHEASANT_API_TOKEN comes from the Secret (see secret.example.yaml).
        # Every serving role refuses to start without it, because these pods
        # bind 0.0.0.0 by necessity. If an ingress already authenticates
        # callers, set behind_authenticating_proxy: true instead and drop the
        # variable.
        token_env: PHEASANT_API_TOKEN
        behind_authenticating_proxy: false
    sources: []
