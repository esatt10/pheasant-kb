# The indexing tier. ONE replica, deliberately, and not autoscaled: indexing
# one source is serialized by a write lease, so a second replica would spend
# its life losing races. More indexing capacity comes from more SHARDS (one
# stack per shard) or more preparation workers, not from more indexers.
#
# A StatefulSet rather than a Deployment for its update semantics: the old pod
# is fully terminated before the new one starts, so two indexers never overlap
# during a rollout. A Deployment's default surge would briefly run both.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pheasant-indexer
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: indexer
spec:
  serviceName: pheasant-indexer
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pheasant
        app.kubernetes.io/component: indexer
    spec:
      # Longer than the api tier's: an in-flight index task should be allowed
      # to reach a checkpoint. It does not need to *finish* — an unacked task
      # is redelivered by the queue's visibility timeout, which is what makes
      # killing an indexer safe.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: pheasant
          image: ghcr.io/esatt10/pheasant:0.12.5
          imagePullPolicy: IfNotPresent
          args: ["serve", "--role", "indexer"]
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PHEASANT_CONFIG
              value: /config/pheasant.yaml
            - name: PHEASANT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pheasant-secrets
                  key: PHEASANT_API_TOKEN
            - name: PHEASANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pheasant-secrets
                  key: PHEASANT_DATABASE_URL
            - name: PHEASANT_INDEX_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pheasant-secrets
                  key: PHEASANT_INDEX_WORKER_TOKEN
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            # The only writer of committed state in the fleet.
            - name: state
              mountPath: /state
            # The manual-upload landing zone, which the api tier also writes.
            # Same claim, same path, so the `document_folder` source an upload
            # registers (`path: /state/uploads/<name>`) resolves here to the
            # bytes the api replica wrote. Without it this pod reads the empty
            # uploads/ inside the state claim and indexes nothing.
            - name: uploads
              mountPath: /state/uploads
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: exports
              mountPath: /exports
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            # Twice the api tier's tolerance. An indexer under a full sync is
            # the *most* likely pod to answer a probe slowly, and restarting
            # it mid-index is the most expensive thing a probe can do here.
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              # The graph lives in memory during a sync, so this is the number
              # capacity-planning.md is about. 6Gi covers ~240,000 files;
              # past that, raise it or shard.
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: pheasant-fleet-config
        - name: state
          persistentVolumeClaim:
            claimName: pheasant-state
        - name: uploads
          persistentVolumeClaim:
            claimName: pheasant-uploads
        - name: workspace
          persistentVolumeClaim:
            claimName: pheasant-workspace
        - name: exports
          persistentVolumeClaim:
            claimName: pheasant-exports
---
apiVersion: v1
kind: Service
metadata:
  name: pheasant-indexer
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: indexer
spec:
  # Headless: nothing load-balances to an indexer. This exists to give the
  # StatefulSet a stable identity and to let Prometheus scrape /metrics.
  clusterIP: None
  selector:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: indexer
  ports:
    - name: http
      port: 8765
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pheasant-indexer
  namespace: pheasant
spec:
  # Zero, and that is not a mistake. One replica cannot satisfy minAvailable:
  # 1 during a voluntary disruption, so setting it would block every node
  # drain forever. An evicted indexer's in-flight task is redelivered by the
  # queue's visibility timeout, so a drain costs latency, not work.
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: indexer
