# The worker's own config. Separate from the fleet ConfigMap for one reason
# that matters: a worker must NOT carry the database DSN, the connector
# credentials, or the source list. It receives a file's bytes and a
# whitelisted parse config and returns chunks — that is the entire trust
# boundary, and giving it a config it does not need would widen it for free.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pheasant-worker-config
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: worker
data:
  pheasant.yaml: |
    pheasant:
      name: k8s-pheasant-worker
      defaults: standalone
      environment: kubernetes
      log_level: INFO
      # A worker never reads or writes authoritative state. These paths exist
      # because the process expects them, not because anything durable lives
      # here — the volumes below are emptyDir.
      state_path: /state
      workspace_root: /workspace
      exports_path: /exports
    server:
      host: 0.0.0.0
      port: 8765
      mcp:
        enabled: false
      api:
        # False, and enforced rather than declared: with this off the process
        # answers /health, /ready, /metrics and its own /internal preparation
        # routes, and 404s everything else. A worker holds no state, no keys
        # and no source list, so serving the knowledge-base API from the tier
        # that scales hardest and runs third-party parse code was surface for
        # nothing. The preparation endpoints are unaffected — they live under
        # /internal and enforce PHEASANT_INDEX_WORKER_TOKEN themselves.
        enabled: false
        openapi: false
        max_concurrent_requests: 32
        drain_seconds: 10
      ui:
        enabled: false
    sync:
      watcher:
        enabled: false
      scheduler:
        enabled: false
      concurrency:
        # This is what makes the pod a worker at all: without it the
        # preparation endpoints 404.
        remote_worker_enabled: true
        remote_worker_token_env: PHEASANT_INDEX_WORKER_TOKEN
    sources: []
