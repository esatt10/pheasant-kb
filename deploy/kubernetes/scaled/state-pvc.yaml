# /state: SQLite (unused here — this fleet is on Postgres), the knowledge
# graph, manifests, snapshots and vectors.
#
# With `evaluation.enabled` this also holds the evaluation plane, which grows
# on a different axis from the corpus: cohort size times the ablation matrix,
# not file count. Size it with `pheasant scan`, which reports the steady state
# and the *peak* separately — the peak is replay checkpoints held while a batch
# is in flight and deleted when it completes, so it is free space the volume
# must have rather than space it fills. See
# docs/how-to/capacity-planning.md#sizing-the-evaluation-plane.
#
# RWX matters for the same reason it does for the graph: an api replica serves
# `/evaluation/status` for a batch an indexer is running, and it reads that
# progress out of this volume.
#
# ReadWriteMany is a HARD requirement, not a preference. The graph is a file
# the indexer writes and every api replica reads; with ReadWriteOnce the
# volume attaches to one node, so api replicas scheduled elsewhere cannot
# read it at all. EFS, Azure Files, CephFS and NFS qualify — most default
# StorageClasses do not.
#
# If your cluster genuinely has no RWX class, the honest alternatives are:
#   * run the single-container install (deploy/kubernetes/) and scale up
#     rather than out; or
#   * pin the api replicas to the indexer's node with affinity, which caps
#     the serving tier at one node's capacity.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pheasant-state
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
spec:
  accessModes:
    - ReadWriteMany
  # storageClassName: efs-sc
  resources:
    requests:
      storage: 50Gi
---
# /workspace: the corpus. Read-only in every pod, so RWX here is about
# sharing, not contention — and unlike /state it is often better supplied by
# a git clone init-container or an object-store sync, in which case drop this
# PVC and mount whatever produces the files.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pheasant-workspace
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
spec:
  accessModes:
    - ReadWriteMany
  # storageClassName: efs-sc
  resources:
    requests:
      storage: 100Gi
---
# /exports: the Parquet extract, and the one volume that exists to be read by
# something that is not pheasant.
#
# It was an `emptyDir` in every workload here, which failed the purpose three
# ways at once: an emptyDir dies with its pod, it cannot be mounted by anything
# outside that pod, and — because each workload declared its own — the
# indexer's export landed in a directory the api replicas could not see. Three
# empty directories all called /exports.
#
# ReadWriteMany for the same reason /state needs it: whoever runs the export
# writes here and every reader mounts the same claim. On a cluster with no RWX
# class, give this claim RWO and mount it only where the export runs, then move
# the files off with a sidecar or an object-store sync — the export is a
# regenerable payload, so losing the volume costs a re-run, never data.
#
# Sized well under /state: a Parquet export of a corpus compresses to a small
# fraction of the state directory it came from.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pheasant-exports
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: exports
spec:
  accessModes:
    - ReadWriteMany
  # storageClassName: efs-sc
  resources:
    requests:
      storage: 20Gi
