# The preparation tier: parse and chunk one file's bytes, return chunks. No
# state, no database, no connector credentials — which is what makes these
# pods safe to autoscale hard and kill freely. A killed worker's request is
# retried by the coordinator against another endpoint, and if every endpoint
# is gone the coordinator prepares locally: the sync gets slower, never wrong.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pheasant-worker
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pheasant
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: pheasant
          image: ghcr.io/esatt10/pheasant:0.12.9
          imagePullPolicy: IfNotPresent
          args: ["serve", "--role", "worker"]
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PHEASANT_CONFIG
              value: /config/pheasant.yaml
            # The ONLY secret a worker gets. Deliberately not the database
            # DSN: a compromised worker must not reach the knowledge base.
            - name: PHEASANT_INDEX_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pheasant-secrets
                  key: PHEASANT_INDEX_WORKER_TOKEN
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            # emptyDir throughout: a worker holds nothing worth keeping, and
            # the file's bytes arrive in the request rather than from a mount.
            - name: state
              mountPath: /state
            - name: workspace
              mountPath: /workspace
            - name: exports
              mountPath: /exports
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              # CPU-heavy and memory-light: this tier parses, it does not hold
              # a graph. That asymmetry is the reason it is a separate tier.
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: pheasant-worker-config
        - name: state
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        - name: exports
          persistentVolumeClaim:
            claimName: pheasant-exports
---
apiVersion: v1
kind: Service
metadata:
  name: pheasant-worker
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: worker
  ports:
    - name: http
      port: 8765
      targetPort: http
