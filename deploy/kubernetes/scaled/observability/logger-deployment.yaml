# The log tier: persist observations, roll them to Parquet, drop expired
# partitions.
#
# It exists so none of that happens on a process that is either answering a
# request or holding the indexer's sync lock. An observation arrives per
# request against a corpus that changes hourly at most, so putting its
# persistence on the API means a database write per search — against the same
# PostgreSQL the lexical search arm contends on — and putting its retention
# roll on the indexer's scheduler beat means a multi-million-row Parquet write
# inside `sync_lock`, stalling incremental sync for every source.
#
# Requires `observability.interactions.enabled` and
# `observability.interactions.queue.enabled` in the ConfigMap. `serve --role
# logger` refuses to start otherwise, rather than idling while reporting
# itself healthy.
#
# Deploy this only when observation is on. With it off, nothing here has
# anything to do and the rest of the fleet is unaffected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pheasant-logger
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
    app.kubernetes.io/component: logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pheasant
      app.kubernetes.io/component: logger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pheasant
        app.kubernetes.io/component: logger
    spec:
      # Long enough to finish the batch in hand. A killed logger loses
      # nothing: an unacked batch returns to the queue on its visibility
      # timeout, and re-applying it is a no-op because every row id is
      # content-addressed on the span it describes.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: pheasant
          image: ghcr.io/esatt10/pheasant:0.12.9
          imagePullPolicy: IfNotPresent
          args: ["serve", "--role", "logger"]
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PHEASANT_CONFIG
              value: /config/pheasant.yaml
            - name: PHEASANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pheasant-secrets
                  key: PHEASANT_DATABASE_URL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            # Read-only: in this topology the ledger lives in PostgreSQL, and
            # cold storage is /exports. Nothing here writes the state volume.
            - name: state
              mountPath: /state
              readOnly: true
            # Writable, and the only tier that writes it: cold partitions land
            # under /exports/interactions/dt=YYYY-MM-DD/.
            - name: exports
              mountPath: /exports
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              # Small and, importantly, flat: the work is one batch of 500
              # rows plus one Parquet row-group at a time. `analytics.py` caps
              # DuckDB at a 512MB spill limit and a 5,000-row group precisely
              # so this does not grow with a day's traffic.
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            # Safe despite the Parquet writer: DuckDB spills inside the export
            # directory, which is a mounted PVC, never onto the root
            # filesystem or /tmp. (In a container /tmp is often a small tmpfs
            # — i.e. RAM — which would defeat the spill limit entirely.)
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: pheasant-fleet-config
        - name: state
          persistentVolumeClaim:
            claimName: pheasant-state
            readOnly: true
        - name: exports
          persistentVolumeClaim:
            claimName: pheasant-exports
---
# Scaling the log tier on its own backlog — never on the index queue's.
#
# `pheasant_log_queue_depth` is a different table with a different failure
# mode: it rises with request traffic, not with corpus churn, so the two tiers
# must not share a signal any more than they share a queue.
#
# One replica handles a great deal. A batch is 500 observations by default and
# the work per batch is a multi-row insert, so this scales far later than the
# preparation tier does. Scale-to-zero is deliberate: a region with no traffic
# has no observations, and an idle logger is pure cost.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pheasant-logger
  namespace: pheasant
spec:
  scaleTargetRef:
    name: pheasant-logger
  minReplicaCount: 0
  maxReplicaCount: 4
  cooldownPeriod: 300
  pollingInterval: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        # Pending plus in-flight, for the same reason the worker scaler
        # includes in-flight: pending drops to zero the moment a batch is
        # claimed, which at scale-to-zero can strand a claimed batch.
        query: (max(pheasant_log_queue_depth{status="pending"}) or vector(0)) + (max(pheasant_log_queue_depth{status="inflight"}) or vector(0))
        # Ten batches — 5,000 observations — before a second replica. Below
        # that, one replica clears the backlog inside a polling interval.
        threshold: "10"
