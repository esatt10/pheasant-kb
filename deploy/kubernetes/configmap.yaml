apiVersion: v1
kind: ConfigMap
metadata:
  name: pheasant-config
  namespace: pheasant
  labels:
    app.kubernetes.io/name: pheasant
data:
  pheasant.yaml: |
    pheasant:
      name: k8s-pheasant
      defaults: standalone
      environment: kubernetes
      log_level: INFO
      state_path: /state
      workspace_root: /workspace
      exports_path: /exports
    server:
      host: 0.0.0.0
      port: 8765
      mcp:
        enabled: true
        transports:
          stdio: false
          streamable_http: true
          sse: false
      api:
        enabled: true
        openapi: true
      ui:
        enabled: true
        graph_visualization: true
    storage:
      sqlite_path: /state/pheasant.db
      graph_path: /state/graphs
      manifest_path: /state/manifests
      max_state_size_gb: 10
    search:
      default_mode: hybrid
      keyword:
        enabled: true
        engine: sqlite_fts5
    sync:
      startup:
        full_validation: true
        repair_missing_indexes: true
      watcher:
        enabled: true
        debounce_ms: 1500
      scheduler:
        enabled: true
        interval_seconds: 900
    security:
      allow_workspace_roots:
        - /workspace
      read_only_sources: true
    sources: []
