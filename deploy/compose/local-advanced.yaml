pheasant:
  name: pheasant-local-advanced
  description: Feature-rich single-node Pheasant profile with SQLite, LanceDB, OpenAI,
    WASM, MCP, and durable memory
  environment: docker
  log_level: INFO
  state_path: /state
  workspace_root: /workspace
  exports_path: /exports
server:
  host: 0.0.0.0
  port: 8765
  role: all
  mcp:
    enabled: true
    transports:
      stdio: false
      streamable_http: true
      sse: false
  api:
    enabled: true
    openapi: true
    max_concurrent_requests: 128
    drain_seconds: 10
    graph_refresh_seconds: 15
  ui:
    enabled: true
    graph_visualization: true
storage:
  backend: sqlite
  graph_snapshots: true
  graph_snapshot_interval_seconds: 600
  graph_checkpoint_seconds: 60
  checkpoint_mtbf_seconds: 86400
  graph_checkpoint_max_seconds: 900
  compression: zstd
  max_state_size_gb: 50
search:
  default_mode: hybrid
  max_results_default: 50
  embeddings:
    enabled: true
    provider: openai-spec
    model: text-embedding-3-small
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    dimensions: 1536
    batch_size: 128
    max_retries: 8
    retry_backoff_seconds: 1.0
  vector_store:
    provider: lancedb
    path: /state/vectors
  wasm_relationship_search: true
ingestion:
  captioner:
    provider: openai-spec
    model: gpt-6-luna
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  transcriber:
    provider: openai-spec
    model: whisper-1
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  extractor:
    provider: sandboxed
    html_text: true
sync:
  watcher:
    enabled: true
    max_watch_paths: 5000
    debounce_ms: 500
    batch_window_ms: 2000
  git:
    enabled: true
    detect_commit_changes: true
    detect_branch_switch: true
    reindex_on_commit: true
  scheduler:
    enabled: true
    interval_seconds: 300
  limits:
    max_files: 250000
    max_file_size_mb: 1024
    max_total_mb: 16384
    follow_symlinks: false
  concurrency:
    max_parallel_sources: 4
    max_parallel_files: 32
    max_parallel_embeddings: 8
    file_executor: thread
    remote_worker_enabled: false
    remote_worker_batch_size: 16
    worker_transport: http
    lock_timeout_seconds: 300
  queue:
    enabled: false
    backend: local
graph:
  memory_entity_bridging: true
  wasm_cross_source_resolution: true
  max_nodes: 1500000
security:
  allow_workspace_roots:
    - /workspace
    - /memory
    - /state
    - /exports
  allow_user_selected_source_paths: true
  read_only_sources: true
  deny_path_traversal: true
  default_exclude_secrets: true
  acl_enforced: false
memory:
  consolidation_enabled: true
  session_ttl_days: null
  user_ttl_days: null
  org_ttl_days: null
  default_policy: prefer
  steering_enabled: true
  usage_tracking: true
  max_records: 100000
  about_max_targets: 8
assistant:
  enabled: true
  provider: openai
  model: gpt-6-luna
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  allow_session_keys: false
  max_context_chunks: 16
  max_output_tokens: 8192
  request_timeout_seconds: 120.0
  max_facts: 24
  workflow: agentic
  retrieval:
    max_rounds: 2
    per_query_results: 10
    max_context_passages: 16
    retrieval_modes:
      - hybrid
      - graph
    expand_graph: true
    expand_depth: 2
    expand_per_node: 6
    grade_evidence: true
    verify_citations: true
    max_facts: 24
sources:
  - name: agent-memory
    type: memory
    path: /memory
    description: Durable agent memory
    include:
      - '**/*.md'
    exclude:
      - '**/*.archived'
    sync:
      on_startup: true
      on_file_change: debounce
      on_git_commit: false
      interval_seconds: 60
synapse:
  publish: false
