pheasant:
  name: pheasant-local-small
  description: Offline-first local Pheasant profile for a laptop or small corpus
  environment: local
  log_level: INFO
  state_path: .pheasant/state
  workspace_root: .
  exports_path: .pheasant/exports
server:
  host: 0.0.0.0
  port: 8765
  role: all
  mcp:
    enabled: true
    transports:
      stdio: true
      streamable_http: true
      sse: false
  api:
    enabled: true
    openapi: true
    max_concurrent_requests: 16
    drain_seconds: 0
    graph_refresh_seconds: 0
  ui:
    enabled: true
    graph_visualization: true
storage:
  backend: sqlite
  graph_snapshots: true
  graph_snapshot_interval_seconds: 900
  graph_checkpoint_seconds: 120
  checkpoint_mtbf_seconds: 86400
  graph_checkpoint_max_seconds: 900
  compression: zstd
  max_state_size_gb: 5
search:
  default_mode: text
  max_results_default: 10
  embeddings:
    enabled: false
    provider: stub
  vector_store:
    provider: numpy
  wasm_relationship_search: false
ingestion:
  captioner:
    provider: stub
  transcriber:
    provider: stub
  extractor:
    provider: auto
    html_text: true
sync:
  watcher:
    enabled: true
    max_watch_paths: 100
    debounce_ms: 1500
    batch_window_ms: 5000
  git:
    enabled: true
    detect_commit_changes: true
    detect_branch_switch: true
    reindex_on_commit: true
  scheduler:
    enabled: true
    interval_seconds: 900
  limits:
    max_files: 50000
    max_file_size_mb: 1024
    max_total_mb: 4096
    follow_symlinks: false
  concurrency:
    max_parallel_sources: 1
    max_parallel_files: 8
    max_parallel_embeddings: 1
    file_executor: thread
    remote_worker_enabled: false
    remote_worker_batch_size: 8
    worker_transport: http
    lock_timeout_seconds: 120
  queue:
    enabled: false
    backend: local
graph:
  memory_entity_bridging: true
  wasm_cross_source_resolution: false
  max_nodes: 250000
security:
  allow_workspace_roots:
    - .
  allow_user_selected_source_paths: true
  read_only_sources: true
  deny_path_traversal: true
  default_exclude_secrets: true
  acl_enforced: false
memory:
  consolidation_enabled: true
  session_ttl_days: null
  user_ttl_days: null
  org_ttl_days: null
  default_policy: prefer
  steering_enabled: false
  usage_tracking: true
  max_records: 10000
  about_max_targets: 3
assistant:
  enabled: true
  provider: none
  allow_session_keys: false
  max_context_chunks: 6
  max_output_tokens: 2048
  request_timeout_seconds: 30.0
  max_facts: 8
  workflow: simple
  retrieval:
    max_rounds: 1
    per_query_results: 4
    max_context_passages: 6
    retrieval_modes:
      - text
    expand_graph: true
    expand_depth: 1
    expand_per_node: 2
    grade_evidence: false
    verify_citations: true
    max_facts: 8
  model: null
sources:
  - name: agent-memory
    type: memory
    path: .pheasant/memory
    description: Durable local agent memory
    include:
      - '**/*.md'
    exclude:
      - '**/*.archived'
    sync:
      on_startup: true
      on_file_change: debounce
      on_git_commit: false
      interval_seconds: 60
synapse:
  publish: false
