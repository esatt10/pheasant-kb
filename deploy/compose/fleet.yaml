pheasant:
  name: pheasant-scalable
  description: High-throughput Pheasant fleet with PostgreSQL, NATS JetStream, gRPC
    workers, LanceDB, OpenAI, WASM, MCP, and opt-in durable memory
  environment: compose
  log_level: INFO
  state_path: /state
  workspace_root: /workspace
  exports_path: /exports
server:
  host: 0.0.0.0
  port: 8765
  role: all
  mcp:
    enabled: true
    transports:
      stdio: false
      streamable_http: true
      sse: false
  api:
    enabled: true
    openapi: true
    max_concurrent_requests: 32
    drain_seconds: 20
    graph_refresh_seconds: 30
  ui:
    enabled: true
    graph_visualization: true
storage:
  backend: postgres
  dsn_env: PHEASANT_DATABASE_URL
  pool_size: 16
  graph_snapshots: true
  graph_snapshot_interval_seconds: 900
  graph_checkpoint_seconds: 120
  checkpoint_mtbf_seconds: 86400
  graph_checkpoint_max_seconds: 300
  compression: zstd
  max_state_size_gb: 250
search:
  default_mode: hybrid
  max_results_default: 100
  embeddings:
    enabled: true
    provider: openai-spec
    model: text-embedding-3-small
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    dimensions: 1536
    batch_size: 128
    max_retries: 10
    retry_backoff_seconds: 2.0
    rate_limit_max_wait_seconds: 900.0
  vector_store:
    provider: lancedb
    path: /state/vectors
  wasm_relationship_search: true
ingestion:
  captioner:
    provider: openai-spec
    model: gpt-5.6-luna
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  transcriber:
    provider: openai-spec
    model: whisper-1
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  extractor:
    provider: auto
    html_text: true
  # Manual ingestion in a role-split fleet. The UI drop zone, an agent's
  # `ingest_submit` and the readiness probe all have to write bytes into
  # /state/uploads before the normal pipeline can index them -- and the only
  # tier a browser or an agent can reach is `api`, which mounts /state
  # read-only because the indexer is the sole writer of committed state.
  #
  # So the bytes are forwarded to the indexer, which performs the identical
  # local write. The indexer reads this same file and ignores the setting: a
  # process that writes its own landing zone never forwards, which is also
  # what stops the tier serving this endpoint proxying to itself.
  #
  # Unset in a single container, where the process that receives an upload is
  # the process that indexes it and there is nothing to forward to.
  landing_service_url: http://indexer:8765
  landing_service_token_env: PHEASANT_INGESTION_SERVICE_TOKEN
sync:
  watcher:
    enabled: true
    max_watch_paths: 20000
    debounce_ms: 250
    batch_window_ms: 1000
  git:
    enabled: true
    detect_commit_changes: true
    detect_branch_switch: true
    reindex_on_commit: true
  scheduler:
    enabled: true
    interval_seconds: 900
  limits:
    max_files: null
    max_file_size_mb: 100
    max_total_mb: null
    follow_symlinks: false
  concurrency:
    max_parallel_sources: 4
    max_parallel_files: 16
    max_parallel_embeddings: 8
    file_executor: remote
    remote_worker_urls:
      - grpc://worker:8766
    remote_worker_enabled: false
    remote_worker_token_env: PHEASANT_INDEX_WORKER_TOKEN
    remote_worker_timeout_seconds: 120
    remote_worker_batch_size: 16
    worker_transport: grpc
    lock_timeout_seconds: 300
  queue:
    enabled: true
    backend: nats
    visibility_seconds: 300
    max_attempts: 5
    nats_servers:
      - nats://nats:4222
    nats_stream: PHEASANT_INDEX
    nats_subject: pheasant.index.tasks
    nats_durable: pheasant-indexers
graph:
  memory_entity_bridging: true
  wasm_cross_source_resolution: true
  query_service_url: http://graph:8765
  query_service_token_env: PHEASANT_GRAPH_SERVICE_TOKEN
  query_service_timeout_seconds: 30.0
  max_nodes: null
security:
  allow_workspace_roots:
    - /workspace
    - /memory
    - /state
    - /exports
  allow_user_selected_source_paths: false
  read_only_sources: true
  deny_path_traversal: true
  default_exclude_secrets: true
  # On in the fleet, off in the single container. A replica set behind a
  # Service is a multi-tenant surface by construction; a laptop is not, and
  # turning this on there would make every un-ACL'd local file need a
  # principal to find.
  acl_enforced: true
  default_visibility: public
  api_auth:
    # The fleet's front door. Compose refuses to start without the value (see
    # docker-compose.scale.yml), because "unauthenticated" plus "can register a
    # source over any allow-listed path" plus "one port-publishing decision
    # away from the network" is a combination that only stays safe by luck.
    # Set behind_authenticating_proxy instead if an ingress already
    # authenticates callers, and drop PHEASANT_API_TOKEN from the environment.
    #
    # Turning the token off for a local UI session belongs in a private
    # override -- `docker compose -f docker-compose.scale.yml -f my.yml`, or a
    # fleet.yaml that is not this one -- rather than here: this file is a
    # published artifact, and the shipped fleet is the one deployment shape
    # that binds 0.0.0.0 by necessity.
    token_env: PHEASANT_API_TOKEN
    behind_authenticating_proxy: false
memory:
  consolidation_enabled: true
  session_ttl_days: null
  user_ttl_days: null
  org_ttl_days: null
  default_policy: prefer
  steering_enabled: true
  usage_tracking: true
  max_records: null
  about_max_targets: 12
assistant:
  enabled: true
  provider: openai
  model: gpt-5.6-luna
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  allow_session_keys: false
  max_context_chunks: 24
  max_output_tokens: 16384
  request_timeout_seconds: 180.0
  max_facts: 32
  workflow: agentic
  retrieval:
    max_rounds: 2
    per_query_results: 16
    max_context_passages: 24
    retrieval_modes:
      - vector
      - graph
      - hybrid
    expand_graph: true
    expand_depth: 2
    expand_per_node: 8
    grade_evidence: true
    verify_citations: true
    max_facts: 32
readiness:
  enabled: true
  corpus_denylist:
    - benchmark/*
    - '*.answers.json'
  max_search_latency_ms: 5000.0
  max_ingest_ack_ms: 30000.0
  max_index_lag_ms: 120000.0
  latency_probe_queries: 12
  concurrency_probe_writers: 4
  concurrency_probe_items: 5
sources: []
observability:
  # The observation plane and its log tier. Off, exactly as it ships: turning it
  # on means recording queries and principals, which is an operator's decision
  # rather than a default. Bring up the `logger` service with it:
  #
  #   docker compose --profile observability -f docker-compose.scale.yml up
  #
  # `serve --role logger` refuses to start unless both flags below are true, so
  # a half-configured tier fails loudly instead of idling while healthy.
  otlp_endpoint: null
  interactions:
    enabled: false
    hot_retention_days: 7
    # Rolls expired rows to Parquet under /exports/interactions/dt=... before
    # deleting them. That directory enforces no access control and these rows
    # carry principals and query text -- put the access control on the volume.
    cold_enabled: false
    cold_retention_days: null
    queue:
      enabled: false
      backend: nats
      nats_stream: PHEASANT_LOGS
      nats_subject: pheasant.logs.batches
      nats_durable: pheasant-loggers
synapse:
  publish: false
