image:
  repository: ghcr.io/esatt10/pheasant
  tag: 0.12.6
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8765

config:
  pheasantYaml: |
    pheasant:
      name: helm-pheasant
      environment: kubernetes
      state_path: /state
      workspace_root: /workspace
      exports_path: /exports
    server:
      host: 0.0.0.0
      port: 8765
      mcp:
        enabled: true
        transports:
          streamable_http: true
      api:
        enabled: true
    storage:
      sqlite_path: /state/pheasant.db
      graph_path: /state/graphs
      manifest_path: /state/manifests
    search:
      default_mode: hybrid
    sync:
      startup:
        full_validation: true
      scheduler:
        enabled: true
        interval_seconds: 900
    sources: []

persistence:
  state:
    enabled: true
    size: 10Gi
    # storageClass: ""
  # /exports: the Parquet extract, and the only volume meant to be read by
  # something that is not pheasant. A durable claim by default — as an
  # emptyDir it died with the pod and nothing outside the pod could reach it,
  # which is the whole point of the directory.
  exports:
    enabled: true
    size: 5Gi
    # ReadWriteMany when the consumer runs in its own pod; ReadWriteOnce is
    # right for a sidecar or a job scheduled on the same node.
    accessMode: ReadWriteOnce
    # storageClass: ""
    # Mount a claim you already have — e.g. the one your warehouse loader
    # reads — instead of letting the chart create one.
    existingClaim: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 6Gi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
