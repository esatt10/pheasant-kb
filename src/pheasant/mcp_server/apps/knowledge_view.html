    for (const [lane, top, h] of bands) {
      bandLabel(canvas, lane, 6, top, width - 12, h);
    }
    for (const node of diagram.nodes) drawNode(canvas, node, pos.get(node.id), sizes.get(node.id).lines);
    for (const edge of diagram.edges) drawEdge(canvas, edge, pos.get(edge.from), pos.get(edge.to));
    return canvas;
  }

  function chips(cites) {
    return (cites || []).map((n) => el("span", { class: "chip" }, String(n)));
  }

  function groupsView(diagram) {
    const grid = el("div", { class: "groups" });
    for (const lane of lanesOf(diagram)) {
      const box = el("div", { class: "group" + (lane.inferred && !lane.implicit ? " inferred" : "") },
        el("div", { class: "group__title" }, lane.label, ...chips(lane.cites)));
      const list = el("div", { class: "group__items" });
      for (const node of diagram.nodes.filter((n) => (n.group || "") === lane.id)) {
        const item = el("span", { class: "item" + (node.inferred ? " inferred" : ""),
          title: node.detail || (node.inferred ? "not cited" : "sources " + node.cites.join(", ")) },
          node.label, ...chips(node.cites));
        list.append(item);
      }
      box.append(list);
      grid.append(box);
    }
    return grid;
  }

  function tableView(diagram) {
    const columns = diagram.columns || [];
    const cells = new Map((diagram.cells || []).map((c) => [c.row + "\u0000" + c.column, c]));
    const table = el("table", { class: "vtable" });
    const head = el("tr", {}, el("th", {}, ""));
    for (const column of columns) head.append(el("th", {}, column.label));
    table.append(el("thead", {}, head));
    const body = el("tbody");
    for (const row of diagram.nodes) {
      const tr = el("tr", {}, el("th", { class: row.inferred ? "inferred" : "" }, row.label, ...chips(row.cites)));
      for (const column of columns) {
        const cell = cells.get(row.id + "\u0000" + column.id);
        tr.append(cell
          ? el("td", { class: cell.inferred ? "inferred" : "" }, cell.text, ...chips(cell.cites))
          : el("td", { class: "muted" }, "—"));
      }
      body.append(tr);
    }
    table.append(body);
    return table;
  }

  function axisText(canvas, text, x, y, anchor, extra) {
    if (!text) return;
    const node = svg("text", { class: "axis-label", x, y, "text-anchor": anchor || "middle", ...(extra || {}) });
    node.textContent = text;
    canvas.append(node);
  }

  function quadrantSvg(diagram) {
    const size = 440, left = 70, top = 16, width = left + size + 150, height = top + size + 60;
    const axes = diagram.axes || {}, x = axes.x || {}, y = axes.y || {};
    const canvas = canvasOf(width, height, diagram.title);
    canvas.append(svg("rect", { class: "plot", x: left, y: top, width: size, height: size }));
    canvas.append(svg("line", { class: "tick", x1: left + size / 2, y1: top, x2: left + size / 2, y2: top + size }));
    canvas.append(svg("line", { class: "tick", x1: left, y1: top + size / 2, x2: left + size, y2: top + size / 2 }));
    axisText(canvas, x.low, left, top + size + 18, "start");
    axisText(canvas, x.high, left + size, top + size + 18, "end");
    axisText(canvas, x.label, left + size / 2, top + size + 40);
    axisText(canvas, y.low, left - 8, top + size, "end");
    axisText(canvas, y.high, left - 8, top + 12, "end");
    axisText(canvas, y.label, 16, top + size / 2, "middle", { transform: `rotate(-90 16 ${top + size / 2})` });
    for (const node of diagram.nodes) {
      if (node.x === undefined || node.y === undefined) continue;
      const cx = left + node.x * size, cy = top + (1 - node.y) * size;
      const group = svg("g", { class: "point" + (node.inferred ? " inferred" : "") });
      group.append(svg("circle", { cx, cy, r: 6 }));
      const label = svg("text", { x: cx + 10, y: cy + 4 });
      label.textContent = node.label + (node.cites.length ? ` [${node.cites.join("][")}]` : "");
      group.append(label);
      const title = svg("title");
      title.textContent = node.detail || node.label;
      group.append(title);
      canvas.append(group);
    }
    return canvas;
  }

  function niceMax(value) {
    if (value <= 0) return 1;
    const power = 10 ** Math.floor(Math.log10(value)), unit = value / power;
    return (unit <= 1 ? 1 : unit <= 2 ? 2 : unit <= 5 ? 5 : 10) * power;
  }

  function chartSvg(diagram) {
    const nodes = diagram.nodes, line = diagram.chart === "line";
    const values = nodes.map((n) => n.value), low = Math.min(0, ...values);
    const high = niceMax(Math.max(...values.map(Math.abs), 0)), span = high - low || 1;
    const left = 64, top = 16, plot = 260, slot = Math.max(64, ...nodes.map((n) => Math.min(150, 7 * n.label.length / 2 + 20)));
    const width = left + slot * nodes.length + 20, height = top + plot + 70;
    const canvas = canvasOf(width, height, diagram.title);
    const yOf = (v) => top + plot - (v - low) / span * plot;
    for (let i = 0; i <= 4; i++) {
      const v = low + span * i / 4, yy = yOf(v);
      canvas.append(svg("line", { class: "grid", x1: left, y1: yy, x2: width - 16, y2: yy }));
      axisText(canvas, (+v.toPrecision(3)).toString(), left - 8, yy + 4, "end");
    }
    const yLabel = ((diagram.axes || {}).y || {}).label || diagram.unit || "";
    axisText(canvas, yLabel, 14, top + plot / 2, "middle", { transform: `rotate(-90 14 ${top + plot / 2})` });
    const points = [];
    nodes.forEach((node, i) => {
      const cx = left + slot * i + slot / 2, yy = yOf(node.value), zero = yOf(0);
      const group = svg("g", { class: "bar" + (node.inferred ? " inferred" : "") });
      if (line) group.append(svg("circle", { cx, cy: yy, r: 5 }));
      else group.append(svg("rect", { x: cx - slot * 0.32, y: Math.min(yy, zero), width: slot * 0.64, height: Math.max(1, Math.abs(zero - yy)), rx: 3 }));
      points.push(`${cx},${yy}`);
      const value = svg("text", { class: "value", x: cx, y: Math.min(yy, zero) - 6, "text-anchor": "middle" });
      value.textContent = `${node.value}${diagram.unit ? " " + diagram.unit : ""}` + (node.cites.length ? ` [${node.cites.join("][")}]` : "");
      group.append(value);
      wrap(node.label, Math.max(8, Math.floor(slot / 7))).slice(0, 2).forEach((part, j) => {
        const text = svg("text", { x: cx, y: top + plot + 18 + j * 14, "text-anchor": "middle" });
        text.textContent = part;
        group.append(text);
      });
      const title = svg("title");
      title.textContent = node.unverified_value ? "this value was not found in its cited passage"
        : node.inferred ? "not cited" : "sources " + node.cites.join(", ");
      group.append(title);
      canvas.append(group);
    });
    if (line) canvas.insertBefore(svg("polyline", { class: "series", points: points.join(" ") }), canvas.children[1] || null);
    return canvas;
  }


  // ---------------------------------------------------------------- UML
  //
  // assistant/visual_uml.py: class, activity, state machine and use case.
  // Pseudo-nodes (start, end, fork/join, choice, merge) are notation, drawn
  // as UML draws them and never clickable — there is nothing to ask about.

  // Longest-path ranks over any edge list, cycles tolerated: relaxation is
  // bounded, and a graph that never settles falls back to declaration order.
  function ranksOf(nodes, edges) {
    const rank = new Map(nodes.map((n) => [n.id, 0]));
    const index = new Map(nodes.map((n, i) => [n.id, i]));
    let settled = false;
    for (let pass = 0; pass <= nodes.length && !settled; pass++) {
      settled = true;
      for (const e of edges) {
        if (!rank.has(e.from) || !rank.has(e.to) || e.from === e.to) continue;
        if (rank.get(e.to) < rank.get(e.from) + 1) { rank.set(e.to, rank.get(e.from) + 1); settled = false; }
      }
    }
    if (!settled) return ranks({ nodes, edges: edges.filter((e) => index.get(e.from) < index.get(e.to)) });
    return rank;
  }

  // Place nodes in ranked layers with the given sizes; returns id -> box.
  function placeLayers(nodes, rank, sizes, horizontal, gapMain, gapCross) {
    const layers = [];
    for (const node of nodes) (layers[rank.get(node.id)] ||= []).push(node);
    const pos = new Map(), extent = [];
    let main = 16;
    for (const layer of layers) {
      if (!layer) continue;
      let widest = 0, cross = 0;
      for (const n of layer) {
        const s = sizes.get(n.id);
        widest = Math.max(widest, horizontal ? s.w : s.h);
        cross += (horizontal ? s.h : s.w) + gapCross;
      }
      extent.push(cross);
      let at = 16;
      for (const n of layer) {
        const s = sizes.get(n.id);
        pos.set(n.id, horizontal ? { x: main + (widest - s.w) / 2, y: at, w: s.w, h: s.h }
          : { x: at, y: main + (widest - s.h) / 2, w: s.w, h: s.h });
        at += (horizontal ? s.h : s.w) + gapCross;
      }
      main += widest + gapMain;
    }
    const widestLayer = Math.max(...extent);
    let li = 0;
    for (const layer of layers) {
      if (!layer) continue;
      const shift = (widestLayer - extent[li++]) / 2;
      for (const n of layer) { const b = pos.get(n.id); if (horizontal) b.y += shift; else b.x += shift; }
    }
    return pos;
  }

  function umlText(canvas, text, x, y, attrs) {
    const node = svg("text", { x, y, ...(attrs || {}) });
    node.textContent = text;
    canvas.append(node);
    return node;
  }

  function citeMark(group, node, box) {
    if (!node.cites || !node.cites.length) return;
    const cite = svg("text", { class: "cite", x: box.x + box.w - 3, y: box.y + 10, "text-anchor": "end" });
    cite.textContent = node.cites.map((n) => `[${n}]`).join("");
    group.append(cite);
  }

  function nodeTitle(group, node, extra) {
    const title = svg("title");
    title.textContent = (node.inferred ? `${node.label} (not cited)` : `${node.label} — sources ${node.cites.join(", ")}`)
      + (extra ? "\n" + extra : "") + (node.detail ? "\n" + node.detail : "");
    group.append(title);
  }

  function askAbout(group, label) {
    group.style.cursor = "pointer";
    group.addEventListener("click", () => request("ui/message", {
      role: "user", content: { type: "text", text: `Tell me more about ${label}` },
    }).catch(() => {}));
  }

  function umlEdge(canvas, edge, a, b, style) {
    const group = svg("g", { class: "edge" + (edge.inferred ? " inferred" : "") + (style.dashed ? " dashed" : "") });
    let d, mx, my;
    const mults = [];
    if (style.path) { [d, mx, my] = style.path; }
    else {
      const [x1, y1] = border(a, b), [x2, y2] = border(b, a);
      d = `M${x1},${y1} L${x2},${y2}`; mx = (x1 + x2) / 2; my = (y1 + y2) / 2;
      if (style.mults) {
        // Multiplicities hug the two ends of the line; kept so a dragged
        // class can carry them with it (see reroute).
        [[0, x1, y1], [1, x2, y2]].forEach(([end, x, y]) => {
          const text = style.mults[end];
          if (!text) return;
          const [px, py] = multAt(x1, y1, x2, y2, end);
          mults.push({ end, node: umlText(canvas, text, px, py, { class: "mult", "text-anchor": "middle" }) });
        });
      }
    }
    const attrs = { d };
    if (style.end) attrs["marker-end"] = `url(#${style.end})`;
    if (style.start) attrs["marker-start"] = `url(#${style.start})`;
    const line = svg("path", attrs);
    group.append(line);
    const title = svg("title");
    title.textContent = edge.inferred ? "not cited" : edge.structural ? "notation" : `sources ${(edge.cites || []).join(", ")}`;
    group.append(title);
    canvas.insertBefore(group, canvas.querySelector("g.node"));
    const label = style.label !== undefined ? style.label : edge.label;
    const text = label ? umlText(canvas, label, mx, my - 5, { class: "edge-label", "text-anchor": "middle" }) : null;
    trackEdge(canvas, { group, line, text, a, b, d, mx, my, mults });
    return group;
  }

  // ---- class diagram
  const CLASS_EDGES = {
    inheritance: { end: "tri" }, realization: { end: "tri", dashed: true },
    composition: { start: "diamond" }, aggregation: { start: "diamond-open" },
    dependency: { end: "open", dashed: true }, association: { end: "open" },
  };

  function classSvg(diagram) {
    const nodes = diagram.nodes;
    const sizes = new Map(nodes.map((n) => {
      const lines = [n.label, ...(n.attributes || []).map((m) => m.text), ...(n.operations || []).map((m) => m.text)];
      const w = Math.min(300, Math.max(130, 6.9 * Math.max(...lines.map((l) => l.length)) + 26));
      const head = n.stereotype ? 40 : 28;
      const h = head + 10 + 15 * (n.attributes || []).length + 10 + 15 * (n.operations || []).length + 6;
      return [n.id, { w: Math.round(w), h, head }];
    }));
    // Parents and wholes above children and parts: rank along the direction
    // the hierarchy reads, not the direction the arrow points.
    const rankEdges = diagram.edges.map((e) => ["inheritance", "realization"].includes(e.relation)
      ? { from: e.to, to: e.from } : { from: e.from, to: e.to });
    const pos = placeLayers(nodes, ranksOf(nodes, rankEdges), sizes, false, 70, 36);
    const size = fit([...pos.values()]);
    const canvas = canvasOf(size.w, size.h + 10, diagram.title);
    for (const n of nodes) {
      const box = pos.get(n.id), s = sizes.get(n.id);
      const group = svg("g", { class: "node uml-class" + (n.inferred ? " inferred" : "") });
      group.append(svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 2 }));
      const cx = box.x + box.w / 2;
      let y = box.y + 17;
      if (n.stereotype) { umlText(group, `«${n.stereotype}»`, cx, y, { "text-anchor": "middle", class: "stereo" }); y += 14; }
      const italic = ["abstract", "interface"].includes(n.stereotype);
      umlText(group, n.label, cx, y, { "text-anchor": "middle", class: "classname" + (italic ? " abstract" : "") });
      y = box.y + s.head;
      group.append(svg("line", { class: "compartment", x1: box.x, y1: y, x2: box.x + box.w, y2: y }));
      y += 4;
      for (const m of n.attributes || []) umlText(group, m.text, box.x + 8, (y += 15) - 3, { class: "member" + (m.inferred ? " inferred" : "") });
      y += 6;
      group.append(svg("line", { class: "compartment", x1: box.x, y1: y, x2: box.x + box.w, y2: y }));
      y += 4;
      for (const m of n.operations || []) umlText(group, m.text, box.x + 8, (y += 15) - 3, { class: "member" + (m.inferred ? " inferred" : "") });
      citeMark(group, n, box);
      nodeTitle(group, n);
      askAbout(group, n.label);
      canvas.append(group);
      track(canvas, group, box);
    }
    for (const e of diagram.edges) {
      const a = pos.get(e.from), b = pos.get(e.to);
      if (!a || !b) continue;
      const style = CLASS_EDGES[e.relation] || CLASS_EDGES.association;
      umlEdge(canvas, e, a, b, { ...style, mults: [e.from_mult, e.to_mult] });
    }
    return canvas;
  }

  // ---- pseudo-nodes shared by activity and state machines
  const PSEUDO_SIZE = { initial: [18, 18], final: [22, 22], flow_final: [20, 20], merge: [30, 30], choice: [30, 30] };

  function drawPseudo(canvas, node, box) {
    const group = svg("g", { class: "node pseudo" });
    const cx = box.x + box.w / 2, cy = box.y + box.h / 2, r = Math.min(box.w, box.h) / 2;
    const title = svg("title");
    title.textContent = node.label;
    if (node.type === "initial") group.append(svg("circle", { class: "solid", cx, cy, r }));
    else if (node.type === "final") {
      group.append(svg("circle", { class: "ring", cx, cy, r }));
      group.append(svg("circle", { class: "solid", cx, cy, r: r - 5 }));
    } else if (node.type === "flow_final") {
      group.append(svg("circle", { class: "ring", cx, cy, r }));
      group.append(svg("path", { class: "cross", d: `M${cx - r * 0.6},${cy - r * 0.6} L${cx + r * 0.6},${cy + r * 0.6} M${cx + r * 0.6},${cy - r * 0.6} L${cx - r * 0.6},${cy + r * 0.6}` }));
    } else if (node.type === "fork" || node.type === "join") {
      group.append(svg("rect", { class: "solid", x: box.x, y: box.y, width: box.w, height: box.h, rx: 2 }));
    } else {
      group.append(svg("polygon", { class: "ring", points: `${cx},${box.y} ${box.x + box.w},${cy} ${cx},${box.y + box.h} ${box.x},${cy}` }));
    }
    box.shape = node.type === "fork" || node.type === "join" ? "box" : node.type === "merge" || node.type === "choice" ? "diamond" : "circle";
    group.append(title);
    canvas.append(group);
    track(canvas, group, box);
  }

  // ---- activity diagram
  function activitySvg(diagram) {
    const nodes = diagram.nodes, edges = diagram.edges;
    const fan = (id) => Math.max(edges.filter((e) => e.from === id).length, edges.filter((e) => e.to === id).length, 2);
    const sizes = new Map(nodes.map((n) => {
      if (n.type === "fork" || n.type === "join") return [n.id, { w: 70 * fan(n.id), h: 7 }];
      if (PSEUDO_SIZE[n.type]) return [n.id, { w: PSEUDO_SIZE[n.type][0], h: PSEUDO_SIZE[n.type][1] }];
      return [n.id, sizeOf({ ...n, shape: n.type === "decision" ? "diamond" : "round" })];
    }));
    const rank = ranksOf(nodes, edges);
    let pos = placeLayers(nodes, rank, sizes, false, 38, 30);
    const lanes = (diagram.groups || []).length || nodes.some((n) => n.group) ? lanesOf(diagram) : [];
    let size = fit([...pos.values()]);
    const canvas = canvasOf(1, 1, diagram.title);
    if (lanes.length > 1) {
      // Partitions are columns: a node keeps its row and moves to its lane.
      // Nodes sharing a lane and a rank (parallel branches) sit side by side,
      // and every lane is as wide as its widest such row.
      const laneOf = new Map(lanes.map((l, i) => [l.id, i]));
      const cells = new Map();
      for (const n of nodes) {
        const key = (laneOf.get(n.group || "") ?? 0) + ":" + rank.get(n.id);
        (cells.get(key) || cells.set(key, []).get(key)).push(n);
      }
      const rowWidth = (list) => list.reduce((w, n) => w + pos.get(n.id).w, 0) + 24 * (list.length - 1);
      const colW = Math.max(180, ...[...cells.values()].map((list) => rowWidth(list) + 40));
      for (const [key, list] of cells) {
        const col = Number(key.split(":")[0]);
        let x = 16 + col * colW + (colW - rowWidth(list)) / 2;
        for (const n of list) { const b = pos.get(n.id); b.x = x; b.y += 28; x += b.w + 24; }
      }
      size = fit([...pos.values()]);
      lanes.forEach((lane, i) => {
        canvas.append(svg("rect", { class: "band" + (lane.inferred && !lane.implicit ? " inferred" : ""), x: 16 + i * colW + 3, y: 8, width: colW - 6, height: size.h, rx: 6 }));
        umlText(canvas, lane.label + (lane.cites && lane.cites.length ? ` [${lane.cites.join("][")}]` : ""), 16 + i * colW + colW / 2, 26, { class: "band-label", "text-anchor": "middle" });
      });
      size = { w: 16 + lanes.length * colW + 16, h: size.h + 16 };
    }
    canvas.setAttribute("width", size.w); canvas.setAttribute("height", size.h);
    canvas.setAttribute("viewBox", `0 0 ${size.w} ${size.h}`);
    canvas.style.maxWidth = size.w + "px"; canvas.style.minWidth = Math.round(size.w * 0.7) + "px";
    for (const n of nodes) {
      const box = pos.get(n.id);
      if (n.structural) { drawPseudo(canvas, n, box); continue; }
      drawNode(canvas, { ...n, shape: n.type === "decision" ? "diamond" : "round" }, box, sizes.get(n.id).lines);
    }
    for (const e of edges) {
      const a = pos.get(e.from), b = pos.get(e.to);
      if (!a || !b) continue;
      const down = b.y > a.y + a.h / 2;
      const [x1, y1, x2, y2] = down ? [a.x + a.w / 2, a.y + a.h, b.x + b.w / 2, b.y] : [...border(a, b), ...border(b, a)];
      const bend = down ? `C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2}` : `L`;
      umlEdge(canvas, e, a, b, { end: "arrow", path: [`M${x1},${y1} ${bend} ${x2},${y2}`, (x1 + x2) / 2 + 6, (y1 + y2) / 2 + 4] });
    }
    return canvas;
  }

  // ---- state machine (a behavior diagram)
  function stateSvg(diagram) {
    const nodes = diagram.nodes, edges = diagram.edges;
    const sizes = new Map(nodes.map((n) => {
      if (PSEUDO_SIZE[n.type]) return [n.id, { w: PSEUDO_SIZE[n.type][0], h: PSEUDO_SIZE[n.type][1] }];
      const inner = ["entry", "do", "exit"].filter((f) => n[f]).map((f) => `${f} / ${n[f]}`);
      const w = Math.min(260, Math.max(110, 7 * Math.max(n.label.length, ...inner.map((t) => t.length * 0.9)) + 30));
      return [n.id, { w: Math.round(w), h: 32 + (inner.length ? 8 + inner.length * 14 : 0), inner }];
    }));
    const stateRank = ranksOf(nodes, edges);
    let across = true;
    let pos = placeLayers(nodes, stateRank, sizes, true, 96, 40);
    if (fit([...pos.values()]).w * 0.7 > Math.max(320, root.clientWidth - 8)) {
      // Too wide for the frame at a readable scale: read top-down instead.
      across = false;
      pos = placeLayers(nodes, stateRank, sizes, false, 58, 60);
    }
    for (const b of pos.values()) { if (across) b.y += 30; else b.x += 20; }
    const size = fit([...pos.values()]);
    const canvas = canvasOf(size.w + (across ? 0 : 90), size.h + 40, diagram.title);
    for (const n of nodes) {
      const box = pos.get(n.id), s = sizes.get(n.id);
      if (n.structural) { drawPseudo(canvas, n, box); continue; }
      const group = svg("g", { class: "node" + (n.inferred ? " inferred" : "") });
      group.append(svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 12 }));
      umlText(group, n.label, box.x + box.w / 2, box.y + 20, { "text-anchor": "middle", class: "classname" });
      if (s.inner.length) {
        group.append(svg("line", { class: "compartment", x1: box.x, y1: box.y + 30, x2: box.x + box.w, y2: box.y + 30 }));
        s.inner.forEach((t, i) => umlText(group, t, box.x + 8, box.y + 46 + i * 14, { class: "member" }));
      }
      box.shape = "round";
      citeMark(group, n, box);
      nodeTitle(group, n);
      askAbout(group, n.label);
      canvas.append(group);
      track(canvas, group, box);
    }
    const rank = new Map([...pos.entries()].map(([id, b]) => [id, across ? b.x : b.y]));
    edges.forEach((e, i) => {
      const a = pos.get(e.from), b = pos.get(e.to);
      if (!a || !b) return;
      if (e.from === e.to) {
        // A self-transition loops off the side no other transition arrives
        // on: the top when reading across, the right when reading down.
        if (across) {
          const x = a.x + a.w / 2, y = a.y;
          umlEdge(canvas, e, a, b, { end: "arrow", path: [`M${x - 14},${y} C${x - 30},${y - 36} ${x + 30},${y - 36} ${x + 14},${y}`, x, y - 30] });
        } else {
          const x = a.x + a.w, y = a.y + a.h / 2;
          umlEdge(canvas, e, a, b, { end: "arrow", path: [`M${x},${y - 9} C${x + 40},${y - 30} ${x + 40},${y + 30} ${x},${y + 9}`, x + 44, y + 42] });
        }
        return;
      }
      if (rank.get(e.to) > rank.get(e.from)) {
        const [x1, y1, x2, y2] = across ? [a.x + a.w, a.y + a.h / 2, b.x, b.y + b.h / 2]
          : [a.x + a.w / 2, a.y + a.h, b.x + b.w / 2, b.y];
        const bend = across ? `C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2}` : `C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2}`;
        umlEdge(canvas, e, a, b, { end: "arrow", path: [`M${x1},${y1} ${bend} ${x2},${y2}`, (x1 + x2) / 2 + (across ? 0 : 8), (y1 + y2) / 2 + (across ? 0 : 4)] });
        return;
      }
      // A transition back to an earlier state bends round the side of the
      // row: under it when reading across, to the right when reading down.
      if (across) {
        const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y + b.h, dip = Math.max(y1, y2) + 30 + (i % 3) * 8;
        umlEdge(canvas, e, a, b, { end: "arrow", path: [`M${x1},${y1} C${x1},${dip} ${x2},${dip} ${x2},${y2}`, (x1 + x2) / 2, dip + 14] });
      } else {
        const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x + b.w, y2 = b.y + b.h / 2, out = Math.max(x1, x2) + 50 + (i % 3) * 10;
        umlEdge(canvas, e, a, b, { end: "arrow", path: [`M${x1},${y1} C${out},${y1} ${out},${y2} ${x2},${y2}`, out - 6, (y1 + y2) / 2] });
      }
    });
    return canvas;
  }

  // ---- use case diagram (a behavior diagram)
  function usecaseSvg(diagram) {
    const nodes = diagram.nodes, edges = diagram.edges;
    const actors = nodes.filter((n) => n.type === "actor"), cases = nodes.filter((n) => n.type !== "actor");
    const boundary = (diagram.groups || [])[0];
    const sizes = new Map(cases.map((n) => [n.id, sizeOf({ ...n, shape: "ellipse" })]));
    const caseW = Math.max(160, ...[...sizes.values()].map((s) => s.w));
    const columns = cases.length > 6 ? 2 : 1;
    const left = actors.filter((_, i) => columns === 1 || i % 2 === 0), right = actors.filter((a) => !left.includes(a));
    const sysX = 150, sysW = columns * (caseW + 30) + 110;
    const pos = new Map();
    let rowY = [70, 70];
    cases.forEach((n, i) => {
      const col = columns === 1 ? 0 : i % 2, s = sizes.get(n.id);
      pos.set(n.id, { x: sysX + 20 + col * (caseW + 30) + (caseW - s.w) / 2, y: rowY[col], w: s.w, h: s.h });
      rowY[col] += s.h + 22;
    });
    const sysH = Math.max(...rowY) - 20;
    const place = (list, x) => list.forEach((n, i) => pos.set(n.id, { x, y: 60 + (i + 0.5) * (sysH / Math.max(1, list.length)) - 30, w: 80, h: 62 }));
    place(left, 40);
    place(right, sysX + sysW + 40);
    const width = sysX + sysW + (right.length ? 170 : 40), height = sysH + 80;
    const canvas = canvasOf(width, height, diagram.title);
    canvas.append(svg("rect", { class: "boundary" + (boundary && boundary.inferred ? " inferred" : ""), x: sysX, y: 30, width: sysW, height: sysH, rx: 4 }));
    umlText(canvas, (boundary ? boundary.label : "System") + (boundary && boundary.cites.length ? ` [${boundary.cites.join("][")}]` : ""), sysX + 12, 50, { class: "band-label" });
    for (const n of actors) {
      const b = pos.get(n.id), cx = b.x + b.w / 2, top = b.y;
      const group = svg("g", { class: "node actor" + (n.inferred ? " inferred" : "") });
      group.append(svg("circle", { cx, cy: top + 8, r: 8 }));
      group.append(svg("path", { class: "stick", d: `M${cx},${top + 16} v18 M${cx - 13},${top + 22} h26 M${cx},${top + 34} l-11,15 M${cx},${top + 34} l11,15` }));
      wrap(n.label, 16).forEach((line, i) => umlText(group, line, cx, top + 64 + i * 13, { "text-anchor": "middle" }));
      citeMark(group, n, { x: b.x + 6, y: b.y - 2, w: b.w, h: b.h });
      nodeTitle(group, n);
      askAbout(group, n.label);
      canvas.append(group);
      b.shape = "box";
      track(canvas, group, b);
    }
    for (const n of cases) drawNode(canvas, { ...n, shape: "ellipse" }, pos.get(n.id), sizes.get(n.id).lines);
    for (const e of edges) {
      const a = pos.get(e.from), b = pos.get(e.to);
      if (!a || !b) continue;
      const relation = e.relation || "association";
      if ((relation === "include" || relation === "extend") && !actors.includes(nodes.find((n) => n.id === e.from))) {
        // Between two use cases in the stack: round the right-hand side, so
        // the arrow never runs through the ellipses in between.
        const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x + b.w, y2 = b.y + b.h / 2;
        const out = sysX + sysW - 14 - (edges.indexOf(e) % 3) * 6;
        umlEdge(canvas, e, a, b, { end: "open", dashed: true, label: `«${relation}»`,
          path: [`M${x1},${y1} C${out},${y1} ${out},${y2} ${x2},${y2}`, out - 30, (y1 + y2) / 2 + 4] });
        continue;
      }
      const style = relation === "include" || relation === "extend"
        ? { end: "open", dashed: true, label: `«${relation}»` }
        : relation === "generalization" ? { end: "tri" } : {};
      umlEdge(canvas, e, a, b, style);
    }
    return canvas;
  }

  function canvasSvg(diagram) {
    const width = 760, height = 480;
    const sizes = new Map(diagram.nodes.map((n) => [n.id, sizeOf(n)]));
    const pos = new Map();
    diagram.nodes.forEach((node, i) => {
      const s = sizes.get(node.id);
      const [fx, fy] = node.x !== undefined ? [node.x, node.y]
        : [0.12 + 0.76 * ((i % 4) / 3), 0.15 + 0.7 * (Math.floor(i / 4) / Math.max(1, Math.ceil(diagram.nodes.length / 4) - 1))];
      pos.set(node.id, { x: 20 + fx * (width - 40) - s.w / 2, y: 20 + fy * (height - 40) - s.h / 2, w: s.w, h: s.h });
    });
    const boxes = [...pos.values()];
    const minX = Math.min(0, ...boxes.map((b) => b.x - 12)), minY = Math.min(0, ...boxes.map((b) => b.y - 12));
    for (const b of boxes) { b.x -= minX; b.y -= minY; }
    const size = fit(boxes);
    const canvas = canvasOf(size.w, size.h, diagram.title);
    for (const node of diagram.nodes) drawNode(canvas, node, pos.get(node.id), sizes.get(node.id).lines);
    for (const edge of diagram.edges) drawEdge(canvas, edge, pos.get(edge.from), pos.get(edge.to));
    return canvas;
  }
})();
</script>
