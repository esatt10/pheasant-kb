<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pheasant knowledge view</title>
<!--
  pheasant's MCP App view (MCP Apps extension, protocol 2026-01-26).

  One self-contained page, no network: an MCP host renders it in a sandboxed
  iframe for `ask_knowledge_base`, `create_visual` and `get_image`, and
  pheasant's own UI hosts the very same file for its chat. It renders from the
  tool result the host sends (`ui/notifications/tool-result`) and can call back
  only through the host (`tools/call get_image`, and `tools/call create_visual`
  to redraw the same passages in another shape), so every byte it shows came
  through a tool the region already ACL-checks.

  Nothing from the result is ever parsed as markup: text goes in through
  textContent and the diagram is built node by node as SVG. A model wrote the
  answer and the diagram labels; treating either as HTML would be the one way
  this page could be made to run something.
-->
<style>
  :root { --bg: #ffffff; --fg: #1d2330; --muted: #5d6677; --line: #d7dbe3; --accent: #2f6fdf;
          --chip: #eaf1fd; --node: #f5f7fb; --inferred: #9aa3b2; --warn: #9a5b00; }
  :root[data-theme="dark"] { --bg: #16191f; --fg: #e7eaf0; --muted: #9aa3b2; --line: #333a46;
          --accent: #7aa7ff; --chip: #22314d; --node: #1f242d; --inferred: #6b7486; --warn: #f0b35a; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 12px 14px; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  h3, h4 { margin: 14px 0 4px; font-size: 14px; }
  p { margin: 6px 0; }
  pre { background: var(--node); border: 1px solid var(--line); padding: 8px; overflow: auto;
    border-radius: 6px; font-size: 12.5px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .chip { display: inline-block; min-width: 1.4em; padding: 0 4px; margin: 0 1px; border-radius: 8px;
    background: var(--chip); color: var(--accent); font-size: 11px; text-align: center; cursor: default; }
  .figure { margin: 10px 0; }
  /* A 2x screenshot shown at its natural size is twice the size it was
     drawn at; cap the height and let a click open it at full size. */
  .figure img { max-width: 100%; max-height: 320px; width: auto; height: auto; cursor: zoom-in;
    border: 1px solid var(--line); border-radius: 6px; }
  .figure img.full { max-height: none; cursor: zoom-out; }
  .figure figcaption { color: var(--muted); font-size: 12.5px; }
  .sources { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  .sources li { font-size: 12.5px; }
  .diagram { width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); padding: 4px 0; }
  .diagram > svg { display: block; margin: 0 auto; width: 100%; height: auto; }
  .visual { margin-top: 12px; }
  .visual__head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .badge { font-size: 11.5px; color: var(--accent); background: var(--chip); border-radius: 10px;
    padding: 1px 8px; }
  .redraw { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .pill { font: 12px system-ui, sans-serif; color: var(--fg); background: var(--node);
    border: 1px solid var(--line); border-radius: 12px; padding: 2px 10px; cursor: pointer; }
  .pill:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pill:disabled { opacity: .6; cursor: default; }
  details.source summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .vtable { border-collapse: collapse; width: 100%; font-size: 13px; }
  .vtable th, .vtable td { border: 1px solid var(--line); padding: 6px 8px; text-align: left;
    vertical-align: top; }
  .vtable thead th { background: var(--node); }
  .vtable .inferred { border-style: dashed; color: var(--muted); }
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;
    padding: 10px; }
  .group { border: 1.2px solid var(--accent); border-radius: 10px; padding: 8px; }
  .group.inferred { border-style: dashed; border-color: var(--inferred); }
  .group__title { font-weight: 600; margin-bottom: 6px; }
  .group__items { display: flex; flex-wrap: wrap; gap: 6px; }
  .item { background: var(--node); border: 1px solid var(--line); border-radius: 8px;
    padding: 2px 8px; font-size: 12.5px; }
  .item.inferred { border-style: dashed; color: var(--muted); }
  .declined { color: var(--warn); }
  svg text { fill: var(--fg); font: 12px system-ui, sans-serif; }
  svg .node > :first-child { fill: var(--node); stroke: var(--accent); stroke-width: 1.2; }
  svg .node.inferred > :first-child { stroke: var(--inferred); stroke-dasharray: 4 3; }
  svg .axis, svg .tick { stroke: var(--muted); stroke-width: 1.2; }
  svg .tick { stroke: var(--line); }
  svg .grid { stroke: var(--line); stroke-width: 1; }
  svg .plot { fill: none; stroke: var(--line); }
  svg .marker, svg .point circle, svg .bar circle { fill: var(--accent); }
  svg .marker.inferred, svg .point.inferred circle { fill: var(--inferred); }
  svg .bar rect { fill: var(--accent); opacity: .85; }
  svg .bar.inferred rect { fill: none; stroke: var(--inferred); stroke-dasharray: 4 3; }
  svg .series { fill: none; stroke: var(--accent); stroke-width: 2; }
  svg .band { fill: var(--node); stroke: var(--line); opacity: .7; }
  svg .band.inferred { stroke-dasharray: 4 3; }
  svg .band-label, svg .when { font-weight: 600; fill: var(--muted); font-size: 12px; }
  svg .axis-label, svg .value { fill: var(--muted); font-size: 11.5px; }
  svg .edge.dashed path { stroke-dasharray: 6 4; }
  svg .uml-class rect, svg .boundary { fill: var(--node); stroke: var(--accent); stroke-width: 1.2; }
  svg .boundary { fill: none; stroke: var(--muted); }
  svg .boundary.inferred { stroke-dasharray: 4 3; }
  svg .compartment { stroke: var(--accent); stroke-width: 1; }
  svg .classname { font-weight: 600; }
  svg .classname.abstract { font-style: italic; }
  svg .stereo { fill: var(--muted); font-size: 11px; }
  svg .member { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  svg .member.inferred { fill: var(--inferred); font-style: italic; }
  svg .mult { fill: var(--muted); font-size: 11px; }
  svg .pseudo .solid { fill: var(--fg); }
  svg .pseudo .ring { fill: var(--bg); stroke: var(--fg); stroke-width: 1.4; }
  svg .pseudo .cross { stroke: var(--fg); stroke-width: 1.4; }
  svg .actor circle { fill: var(--bg); stroke: var(--fg); stroke-width: 1.4; }
  svg .actor .stick { fill: none; stroke: var(--fg); stroke-width: 1.4; }
  svg .actor.inferred circle, svg .actor.inferred .stick { stroke-dasharray: 3 2; }
  svg .edge path, svg .edge line { stroke: var(--muted); stroke-width: 1.2; fill: none; }
  svg .edge.inferred path, svg .edge.inferred line { stroke-dasharray: 4 3; }
  svg .edge text, svg .edge-label { fill: var(--muted); font-size: 11px; }
  svg .edge-label { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  svg .cite { fill: var(--accent); font-size: 10px; }
  svg .lifeline { stroke: var(--line); stroke-dasharray: 3 3; }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0;
    font: inherit; }
  /* Expand / collapse and, when expanded, reset. Hidden unless the host says
     it can give the view the whole window (hostContext.availableDisplayModes). */
  .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tool { display: inline-flex; align-items: center; gap: 5px; font: 12px system-ui, sans-serif;
    color: var(--fg); background: var(--node); border: 1px solid var(--line); border-radius: 12px;
    padding: 2px 10px; cursor: pointer; }
  .tool:hover { border-color: var(--accent); color: var(--accent); }
  .tool svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; }
  .hint { font-size: 12px; color: var(--muted); }
  .tool.icon { padding: 2px 7px; }
  .diagram svg.pannable { cursor: grab; }
  .diagram svg.panning { cursor: grabbing; }
  /* Expanded: the visual is the whole page. Everything else in the result is
     still there, and is shown again on collapse. */
  body.fs { overflow: hidden; }
  body.fs main { padding: 0; }
  body.fs #root > :not(.fs-target) { display: none; }
  body.fs .fs-target { margin: 0; height: 100vh; box-sizing: border-box; padding: 10px 14px;
    display: flex; flex-direction: column; }
  body.fs .fs-target details.source { display: none; }
  body.fs .fs-target .diagram { flex: 1; min-height: 0; position: relative; }
  body.fs .fs-target .diagram > svg { max-width: none !important; }
  body.fs .fs-target .diagram.movable { overflow: hidden; }
  body.fs .fs-target .diagram.movable > svg { position: absolute; inset: 0; width: 100%; height: 100%;
    max-width: none !important; min-width: 0 !important; touch-action: none; user-select: none; }
  body.fs .diagram.movable svg .node { cursor: grab !important; }
  body.fs .diagram.movable svg .node.dragging { cursor: grabbing !important; }
  body.fs .diagram.movable svg .node.dragging > :first-child { stroke-width: 2.4; }
</style>
</head>
<body>
<main id="root"><p class="muted">Waiting for a result…</p></main>
<script>
(() => {
  "use strict";
  const PROTOCOL = "2026-01-26";
  const root = document.getElementById("root");
  let nextId = 1;
  const pending = new Map();

  // ---------------------------------------------------------------- bridge
  function send(message) { window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ id, method, params });
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      setTimeout(() => { if (pending.delete(id)) reject(new Error(method + " timed out")); }, 20000);
    });
  }
  function notify(method, params) { send({ method, params }); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && pending.has(message.id)) {
      const waiter = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) waiter.reject(new Error(message.error.message || "error"));
      else waiter.resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-result") render(message.params || {});
    if (message.method === "ui/notifications/host-context-changed") applyContext(message.params);
  });

  // What the host said about itself: the display modes it can give this view
  // (the Expand button exists only if "fullscreen" is among them) and the one
  // it is in now.
  let hostContext = {};
  let expanded = null;        // the visual currently shown fullscreen
  let requested = null;       // the visual whose Expand was just clicked
  const visuals = new Set();  // every visual on the page, for refreshTools
  function applyContext(context) {
    if (!context) return;
    if (context.theme === "dark" || context.theme === "light") {
      document.documentElement.dataset.theme = context.theme;
    }
    if (Array.isArray(context.availableDisplayModes)) {
      hostContext.availableDisplayModes = context.availableDisplayModes;
      for (const holder of [...visuals]) refreshTools(holder);
    }
    // The host can collapse the view itself (its own close control, a
    // navigation): follow it rather than insisting on the mode we asked for.
    if (typeof context.displayMode === "string") applyMode(context.displayMode);
  }

  // The content's own height, not the document's: a document is never
  // shorter than the frame showing it, so measuring it would let a host grow
  // the frame and never shrink it back.
  function reportSize() {
    // Expanded, the frame is the host's whole window and its size is not ours
    // to report: the answer would be the window's own height, fed back.
    if (expanded) return;
    const box = root.getBoundingClientRect();
    notify("ui/notifications/size-changed", {
      width: Math.ceil(box.width),
      height: Math.ceil(box.bottom + 8),
    });
  }
  new ResizeObserver(reportSize).observe(root);

  request("ui/initialize", {
    protocolVersion: PROTOCOL,
    clientInfo: { name: "pheasant-knowledge-view", version: "1" },
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
  }).then((result) => {
    applyContext(result && result.hostContext);
    notify("ui/notifications/initialized", {});
  }).catch(() => notify("ui/notifications/initialized", {}));

  // ---------------------------------------------------------------- helpers
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (key === "class") node.className = value; else node.setAttribute(key, value);
    }
    for (const child of children) {
      if (child === null || child === undefined) continue;
      node.append(typeof child === "string" ? document.createTextNode(child) : child);
    }
    return node;
  }
  const SVG = "http://www.w3.org/2000/svg";
  function svg(tag, attrs) {
    const node = document.createElementNS(SVG, tag);
    for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, String(value));
    return node;
  }

  function payloadOf(result) {
    if (result.structuredContent && typeof result.structuredContent === "object") {
      return result.structuredContent.result && typeof result.structuredContent.result === "object"
        ? result.structuredContent.result : result.structuredContent;
    }
    for (const block of result.content || []) {
      if (block.type === "text") { try { return JSON.parse(block.text); } catch (_) { /* text */ } }
    }
    return {};
  }

  // ---------------------------------------------------------------- render
  function render(result) {
    // A new result replaces the visual that was expanded; leave the mode
    // (and tell the host) rather than strand it in fullscreen on nothing.
    if (expanded) collapse();
    visuals.clear();
    root.replaceChildren();
    const image = (result.content || []).find((block) => block.type === "image");
    const payload = payloadOf(result);
    if (image) { renderImageResult(image, payload); reportSize(); return; }
    if (typeof payload.answer === "string") renderAnswer(payload);
    else if (payload.visual) renderVisual(payload.visual, payload.citations || []);
    else root.append(el("p", { class: "muted" }, "Nothing to show for this result."));
    reportSize();
  }

  function renderImageResult(image, payload) {
    const figure = el("figure", { class: "figure" });
    figure.append(el("img", { src: `data:${image.mimeType};base64,${image.data}`,
      alt: payload.caption || payload.relative_path || "image" }));
    figure.append(el("figcaption", {}, [payload.relative_path, payload.caption]
      .filter(Boolean).join(" — ")));
    root.append(figure);
  }

  function renderAnswer(payload) {
    const citations = payload.citations || [];
    const figures = payload.figures || [];
    const route = payload.route || {};
    const bits = [route.intent, route.depth && route.depth + " answer"].filter(Boolean);
    if (bits.length) root.append(el("p", { class: "muted" }, bits.join(" · ")));
    renderText(payload.answer, citations, figures, root);
    if (payload.visual && payload.visual.status) {
      const visual = payload.visual.type === "images"
        ? { ...payload.visual, figures: (payload.visual.figures || []).map((f) => ({ ...f,
            shown: (figures.find((g) => g.figure === f.figure) || f).shown })) }
        : payload.visual;
      renderVisual(visual, citations);
    }
    renderSources(citations);
  }

  // A deliberately small Markdown subset — the one the UI's AnswerBody
  // renders — built with DOM calls only.
  function renderText(text, citations, figures, into) {
    const parts = String(text || "").split("```");
    parts.forEach((part, index) => {
      if (index % 2 === 1) {
        const newline = part.indexOf("\n");
        into.append(el("pre", {}, el("code", {}, newline > 0 ? part.slice(newline + 1) : part)));
        return;
      }
      for (const block of part.split(/\n{2,}/)) {
        const lines = block.split("\n").filter((line) => line.trim());
        if (!lines.length) continue;
        const figureOnly = lines.length === 1 && /^\s*\[fig:(\d{1,2})\]\s*$/.exec(lines[0]);
        if (figureOnly) { into.append(figureBlock(Number(figureOnly[1]), figures)); continue; }
        const heading = lines.length === 1 && /^(#{1,4})\s+(.*)$/.exec(lines[0]);
        if (heading) { into.append(el(heading[1].length <= 3 ? "h3" : "h4", {},
          ...inline(heading[2], citations, figures))); continue; }
        if (lines.every((line) => /^\s*[-*•]\s+/.test(line))) {
          into.append(el("ul", {}, ...lines.map((line) =>
            el("li", {}, ...inline(line.replace(/^\s*[-*•]\s+/, ""), citations, figures)))));
          continue;
        }
        if (lines.every((line) => /^\s*\d+[.)]\s+/.test(line))) {
          into.append(el("ol", {}, ...lines.map((line) =>
            el("li", {}, ...inline(line.replace(/^\s*\d+[.)]\s+/, ""), citations, figures)))));
          continue;
        }
        into.append(el("p", {}, ...inline(block, citations, figures)));
      }
    });
  }

  function inline(text, citations, figures) {
    const out = [];
    const pattern = /(\[fig:\d{1,2}\])|(\[\d{1,2}\])|(`[^`]+`)|(\*\*[^*]+\*\*)/;
    let rest = text;
    while (rest) {
      const match = pattern.exec(rest);
      if (!match) { out.push(rest); break; }
      if (match.index > 0) out.push(rest.slice(0, match.index));
      const token = match[0];
      if (token.startsWith("[fig:")) {
        const figure = figures.find((f) => f.figure === Number(token.slice(5, -1)));
        out.push(el("span", { class: "chip", title: figure ? figure.relative_path || "" : "" },
          "fig " + token.slice(5, -1)));
      } else if (/^\[\d{1,2}\]$/.test(token)) {
        const index = Number(token.slice(1, -1));
        const citation = citations.find((c) => c.index === index);
        out.push(el("span", { class: "chip", title: citation ? citation.title || "" : "" },
          String(index)));
      } else if (token.startsWith("`")) {
        out.push(el("code", {}, token.slice(1, -1)));
      } else {
        out.push(el("strong", {}, token.slice(2, -2)));
      }
      rest = rest.slice(match.index + token.length);
    }
    return out;
  }

  function figureBlock(number, figures) {
    const figure = figures.find((f) => f.figure === number);
    const holder = el("figure", { class: "figure" });
    if (!figure) return holder;
    const caption = el("figcaption", {}, `Fig. ${number} — ${figure.relative_path || ""}` +
      (figure.caption ? ` — ${figure.caption}` : ""));
    holder.append(el("p", { class: "muted" }, "Loading image…"), caption);
    // Through the host, never a fetch: the view has no network, and the
    // tool is what applies the region's ACL to the bytes.
    request("tools/call", { name: "get_image", arguments: { node_id: figure.node_id } })
      .then((result) => {
        const image = (result && result.content || []).find((block) => block.type === "image");
        const img = image ? el("img", { src: `data:${image.mimeType};base64,${image.data}`,
          alt: figure.caption || figure.alt || figure.relative_path || "figure" }) : null;
        if (img) img.addEventListener("click", () => { img.classList.toggle("full"); reportSize(); });
        holder.firstChild.replaceWith(img || el("p", { class: "muted" }, "Image unavailable."));
        reportSize();
      })
      .catch(() => { holder.firstChild.replaceWith(el("p", { class: "muted" }, "Image unavailable.")); });
    return holder;
  }

  function renderSources(citations) {
    if (!citations.length) return;
    const list = el("ol", {});
    for (const citation of citations) {
      list.append(el("li", { value: String(citation.index) },
        citation.relative_path || citation.title || citation.node_id || "source"));
    }
    root.append(el("div", { class: "sources" }, el("div", { class: "muted" }, "Sources"), list));
  }

  // ---------------------------------------------------------------- visuals
  //
  // A visual is a spec (assistant.visual_specs): cited nodes and edges plus
  // the few fields a shape needs. Each kind has a renderer below; all of them
  // build SVG or DOM node by node and put every label in through textContent.

  const KIND_LABELS = {
    flow: "Flow", sequence: "Sequence", hierarchy: "Tree", mindmap: "Mind map",
    concept: "Concept map", cycle: "Cycle", timeline: "Timeline", swimlane: "Swimlanes",
    layers: "Layers", groups: "Groups", table: "Table", quadrant: "2×2", chart: "Chart",
    canvas: "Canvas", class: "UML class", activity: "UML activity", state: "State machine",
    usecase: "Use cases",
  };
  const RENDERERS = {
    flow: flowSvg, hierarchy: (d) => layeredSvg(d, false),
    sequence: sequenceSvg, mindmap: mindmapSvg, concept: conceptSvg, cycle: cycleSvg,
    timeline: timelineSvg, swimlane: swimlaneSvg, layers: layersSvg, groups: groupsView,
    table: tableView, quadrant: quadrantSvg, chart: chartSvg, canvas: canvasSvg,
    class: classSvg, activity: activitySvg, state: stateSvg, usecase: usecaseSvg,
  };

  function renderVisual(visual, citations, into) {
    into = into || root;
    const holder = el("section", { class: "visual" });
    into.append(holder);
    drawVisual(holder, visual, citations);
  }

  function drawVisual(holder, visual, citations) {
    holder.replaceChildren();
    if (visual.status === "pending") {
      holder.append(el("p", { class: "muted" }, "Drawing the visual…"));
      return;
    }
    if (visual.status !== "ok") {
      holder.append(el("p", { class: "declined" }, "No visual: " + (visual.reason || "declined")));
      return;
    }
    if (visual.type === "images") {
      // An answer already shows the figures it names inline; the gallery is
      // for the ones it did not.
      const figures = (visual.figures || []).filter((f) => !f.shown);
      for (const figure of figures) holder.append(figureBlock(figure.figure, visual.figures));
      return;
    }
    const diagram = visual.diagram || {};
    const head = el("div", { class: "visual__head" }, el("h1", {}, diagram.title || "Diagram"));
    if (diagram.viewpoint) head.append(el("span", { class: "badge" }, "Viewpoint: " + diagram.viewpoint));
    const tools = el("div", { class: "tools" });
    head.append(tools);
    holder.append(head);
    if (visual.note) holder.append(el("p", { class: "muted" }, visual.note));
    if (diagram.summary) holder.append(el("p", { class: "muted" }, diagram.summary));
    const draw = RENDERERS[diagram.kind] || RENDERERS.flow;
    const body = el("div", { class: "diagram" });
    try { body.append(draw(diagram)); }
    catch (_) { body.append(layeredSvg(diagram, true)); }
    holder.append(body);
    holder.__tools = tools;
    holder.__body = body;
    holder.__canvas = body.firstElementChild instanceof SVGElement ? body.firstElementChild : null;
    if (holder.__canvas) attachView(holder);
    visuals.add(holder);
    const grounding = visual.grounding || {};
    holder.append(el("p", { class: "muted" },
      `${grounding.cited || 0} of ${(grounding.cited || 0) + (grounding.inferred || 0)} elements ` +
      `cite a passage; dashed ones do not. Source: ${visual.source === "graph"
        ? "the index's own graph edges" : "the model, checked against the passages"}.`));
    if (visual.redraw) holder.append(redrawBar(holder, visual, citations));
    const source = visual.mermaid ? ["Mermaid", visual.mermaid]
      : visual.markdown ? ["Markdown", visual.markdown] : null;
    if (source) {
      holder.append(el("details", { class: "source" }, el("summary", {}, source[0] + " source"),
        el("pre", {}, el("code", {}, source[1]))));
    }
    // A redraw while expanded stays expanded, on the new picture.
    if (holder === expanded) mountStage(holder);
    refreshTools(holder);
  }

  // ---------------------------------------------------------------- expand
  //
  // "Expand" asks the host for the whole window (`ui/request-display-mode`,
  // MCP Apps 2026-01-26) and shows the button only where the host says it can
  // ("fullscreen" in hostContext.availableDisplayModes). Expanded, the diagram
  // fills the frame and its nodes can be dragged; the edges follow. Collapsing
  // returns to the inline picture, which keeps whatever layout was made.
  // Nothing about a drag reaches the host or the region: a layout is a view
  // of the same cited passages, not new knowledge.

  const ICONS = {
    expand: "M9.5 2H14v4.5 M6.5 14H2V9.5 M14 2 9 7 M2 14l5-5",
    collapse: "M14 6.5H9.5V2 M2 9.5h4.5V14 M9.5 6.5 14 2 M6.5 9.5 2 14",
    reset: "M2.5 8a5.5 5.5 0 1 0 1.8-4 M2.5 2.5v3h3",
    zoomin: "M7 4.5v5 M4.5 7h5 M11 11l3 3 M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10z",
    zoomout: "M4.5 7h5 M11 11l3 3 M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10z",
    fit: "M2 5.5V2h3.5 M10.5 2H14v3.5 M14 10.5V14h-3.5 M5.5 14H2v-3.5",
  };
  function tool(label, icon, title, onClick) {
    const icons = svg("svg", { viewBox: "0 0 16 16", "aria-hidden": "true" });
    icons.append(svg("path", { d: ICONS[icon] }));
    const button = el("button", { class: "tool", type: "button", title, "aria-label": title });
    button.append(icons, document.createTextNode(label));
    button.addEventListener("click", onClick);
    return button;
  }
  const canExpand = () => (hostContext.availableDisplayModes || []).includes("fullscreen");

  function refreshTools(holder) {
    const tools = holder && holder.__tools;
    if (!tools) return;
    tools.replaceChildren();
    if (holder.__canvas) {
      tools.append(
        iconTool("zoomin", "Zoom in (or Ctrl + scroll)", () => zoomBy(holder, 1.25)),
        iconTool("zoomout", "Zoom out", () => zoomBy(holder, 0.8)),
        tool("Fit", "fit", "Fit the whole diagram in view", () => fitView(holder)));
    }
    if (holder === expanded) {
      if (movable(holder)) {
        tools.append(el("span", { class: "hint" }, "Drag a node to move it"),
          tool("Reset layout", "reset", "Put every node back where it was drawn", () => resetLayout(holder)));
      }
      tools.append(tool("Collapse", "collapse", "Back to the normal size (Esc)", collapse));
    } else if (canExpand()) {
      tools.append(tool("Expand", "expand", "Open at full size and rearrange the nodes", () => {
        requested = holder;
        request("ui/request-display-mode", { mode: "fullscreen" })
          .then((result) => applyMode((result && result.mode) || "fullscreen"))
          .catch(() => { requested = null; });
      }));
    }
  }

  function iconTool(icon, title, onClick) {
    const button = tool("", icon, title, onClick);
    button.classList.add("icon");
    return button;
  }

  // ---- zoom, pan, fit: the viewBox is the camera
  //
  // Every diagram is an SVG drawn in its own units, so zooming and panning
  // move the viewBox and nothing else: no node is re-laid out, a dragged
  // node keeps where it was put, and citations stay attached to their
  // elements. Fit returns to the framing the diagram would have without
  // any of it - the stage when expanded, the drawn extent inline.

  function viewOf(canvas) {
    const box = canvas.viewBox.baseVal;
    return { x: box.x, y: box.y, w: box.width, h: box.height };
  }
  function setView(canvas, view) {
    canvas.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  }
  function homeOf(holder) {
    const canvas = holder.__canvas;
    if (!canvas.__home) canvas.__home = viewOf(canvas);
    return canvas.__home;
  }

  function zoomBy(holder, factor, at) {
    const canvas = holder.__canvas;
    if (!canvas || !canvas.viewBox.baseVal.width) return;
    const home = homeOf(holder), view = viewOf(canvas);
    // Between an eighth of the diagram and four times its frame.
    const w = Math.min(home.w * 4, Math.max(home.w / 8, view.w / factor));
    const k = w / view.w;
    const cx = at ? at.x : view.x + view.w / 2, cy = at ? at.y : view.y + view.h / 2;
    setView(canvas, { x: cx - (cx - view.x) * k, y: cy - (cy - view.y) * k, w, h: view.h * k });
    canvas.classList.add("pannable");
  }

  function fitView(holder) {
    const canvas = holder.__canvas;
    if (!canvas) return;
    canvas.classList.remove("pannable");
    if (holder === expanded && movable(holder)) { fitStage(holder); return; }
    // Inline, the framing to return to is the one the diagram was drawn in -
    // unless a node was moved while expanded, when the drawn extent no
    // longer holds every node and has to be measured again.
    const moved = canvas.__scene && scene(canvas).nodes.some((r) => r.dx || r.dy);
    if (moved && !canvas.__fixed) { fitExtent(canvas); return; }
    if (canvas.__home) setView(canvas, canvas.__home);
  }

  function attachView(holder) {
    const canvas = holder.__canvas;
    homeOf(holder);
    const point = (event) => {
      const matrix = canvas.getScreenCTM();
      return matrix ? new DOMPoint(event.clientX, event.clientY).matrixTransform(matrix.inverse()) : null;
    };
    // Inline, the wheel scrolls the conversation unless Ctrl/⌘ is held (as
    // on a map in a page); expanded, the diagram is the page and the wheel
    // zooms it.
    canvas.addEventListener("wheel", (event) => {
      if (!(event.ctrlKey || event.metaKey || holder === expanded)) return;
      event.preventDefault();
      zoomBy(holder, Math.exp(-event.deltaY * 0.0015), point(event));
    }, { passive: false });
    // Panning drags the background; a node still belongs to its own drag
    // (expanded) or click (inline). A touch pans only when expanded, so a
    // finger scrolling past an inline diagram still scrolls.
    let pan = null, swallow = false;
    canvas.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      if (event.target.closest && event.target.closest("g.node")) return;
      if (event.pointerType === "touch" && holder !== expanded) return;
      pan = { id: event.pointerId, x: event.clientX, y: event.clientY, view: viewOf(canvas), moved: false };
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!pan || event.pointerId !== pan.id) return;
      const dx = event.clientX - pan.x, dy = event.clientY - pan.y;
      if (!pan.moved) {
        if (Math.hypot(dx, dy) < 4) return;
        pan.moved = true;
        canvas.classList.add("panning", "pannable");
        try { canvas.setPointerCapture(pan.id); } catch (_) { /* still works */ }
      }
      const rect = canvas.getBoundingClientRect();
      const sx = pan.view.w / (rect.width || 1), sy = pan.view.h / (rect.height || 1);
      setView(canvas, { x: pan.view.x - dx * sx, y: pan.view.y - dy * sy, w: pan.view.w, h: pan.view.h });
    });
    const finish = (event) => {
      if (!pan || event.pointerId !== pan.id) return;
      if (pan.moved) { swallow = true; setTimeout(() => { swallow = false; }, 0); }
      canvas.classList.remove("panning");
      pan = null;
    };
    canvas.addEventListener("pointerup", finish);
    canvas.addEventListener("pointercancel", finish);
    canvas.addEventListener("click", (event) => { if (swallow) event.stopPropagation(); }, true);
  }

  function collapse() {
    request("ui/request-display-mode", { mode: "inline" })
      .catch(() => {});
    // Do not wait on the host to leave: a host that never answers must not
    // leave the view stuck covering the conversation.
    applyMode("inline");
  }

  function applyMode(mode) {
    if (mode === "fullscreen") {
      const holder = requested;
      requested = null;
      if (!holder || expanded === holder || !holder.isConnected) return;
      expanded = holder;
      document.body.classList.add("fs");
      holder.classList.add("fs-target");
      mountStage(holder);
      refreshTools(holder);
      return;
    }
    requested = null;
    if (!expanded) return;
    const holder = expanded;
    expanded = null;
    unmountStage(holder);
    holder.classList.remove("fs-target");
    document.body.classList.remove("fs");
    refreshTools(holder);
    reportSize();
  }
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && expanded) collapse();
  });
  window.addEventListener("resize", () => { if (expanded) fitStage(expanded); });

  // ---- the scene: what can be moved, and what has to follow it

  function scene(canvas) {
    return canvas.__scene || (canvas.__scene = { nodes: [], byBox: new Map(), edges: [], base: null });
  }
  function track(canvas, group, box) {
    const record = { group, box, dx: 0, dy: 0 };
    const s = scene(canvas);
    s.nodes.push(record);
    s.byBox.set(box, record);
  }
  function trackEdge(canvas, edge) {
    const s = scene(canvas), a = s.byBox.get(edge.a), b = s.byBox.get(edge.b);
    if (!a || !b) return;    // e.g. a sequence message: no boxes to follow
    edge.from = a; edge.to = b;
    edge.tx = edge.text ? [Number(edge.text.getAttribute("x")), Number(edge.text.getAttribute("y"))] : null;
    s.edges.push(edge);
  }
  const movable = (holder) => !!(holder.__canvas && holder.__canvas.__scene && !holder.__canvas.__fixed
    && holder.__canvas.__scene.nodes.length);

  const now = (r) => ({ x: r.box.x + r.dx, y: r.box.y + r.dy, w: r.box.w, h: r.box.h, shape: r.box.shape });
  const shifted = (r) => `translate(${r.dx} ${r.dy})`;

  // Where a class diagram's multiplicity sits: a little way in from an end of
  // the line, and a little to the side of it.
  function multAt(x1, y1, x2, y2, end) {
    const len = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / len, uy = (y2 - y1) / len;
    const sign = end === 0 ? 1 : -1, x = end === 0 ? x1 : x2, y = end === 0 ? y1 : y2;
    return [x + ux * 16 * sign - uy * 9, y + uy * 16 * sign + ux * 9];
  }

  // A moved node's edges are redrawn as straight lines between the nodes'
  // current borders; an edge whose ends are both home goes back to the path
  // its layout drew, so Reset (or dragging a node back) is exact.
  function reroute(edge) {
    const { from, to } = edge;
    const home = !from.dx && !from.dy && !to.dx && !to.dy;
    if (from === to) {
      // A self-transition is a loop hanging off its node: it moves with it.
      const at = home ? null : shifted(from);
      for (const part of [edge.group, edge.text]) {
        if (!part) continue;
        if (at) part.setAttribute("transform", at); else part.removeAttribute("transform");
      }
      return;
    }
    const a = now(from), b = now(to);
    const [x1, y1] = border(a, b), [x2, y2] = border(b, a);
    edge.line.setAttribute("d", home ? edge.d : `M${x1},${y1} L${x2},${y2}`);
    if (edge.text) {
      const [tx, ty] = home ? edge.tx : [(x1 + x2) / 2, (y1 + y2) / 2 - 5];
      edge.text.setAttribute("x", tx); edge.text.setAttribute("y", ty);
    }
    for (const mult of edge.mults || []) {
      const [px, py] = multAt(x1, y1, x2, y2, mult.end);
      mult.node.setAttribute("x", px); mult.node.setAttribute("y", py);
    }
  }

  function moveNode(canvas, record, dx, dy) {
    record.dx = dx; record.dy = dy;
    if (dx || dy) record.group.setAttribute("transform", shifted(record));
    else record.group.removeAttribute("transform");
    for (const edge of scene(canvas).edges) if (edge.from === record || edge.to === record) reroute(edge);
  }

  function resetLayout(holder) {
    const canvas = holder.__canvas;
    for (const record of scene(canvas).nodes) moveNode(canvas, record, 0, 0);
    fitStage(holder);
  }

  // ---- the stage: the frame's own size, in the diagram's own units

  function baseOf(canvas) {
    const s = scene(canvas);
    if (!s.base) { const box = canvas.viewBox.baseVal; s.base = { w: box.width, h: box.height }; }
    return s.base;
  }

  // Expanded, the canvas grows to the frame at the scale that fits the
  // drawing (capped, so a small diagram is not blown up into blur) and the
  // spare room around it is somewhere a node can go.
  function fitStage(holder) {
    if (!movable(holder)) return;    // a table or a grid has no stage to fit
    const canvas = holder.__canvas, base = baseOf(canvas);
    const area = holder.__body.getBoundingClientRect();
    if (!area.width || !area.height) return;
    const scale = Math.min(area.width / base.w, area.height / base.h, 1.6);
    const w = area.width / scale, h = area.height / scale;
    const x = (base.w - w) / 2, y = (base.h - h) / 2;
    canvas.setAttribute("viewBox", `${x} ${y} ${w} ${h}`);
    canvas.__stage = { x, y, w, h };
    canvas.__home = { x, y, w, h };
    // A window that shrank must not strand a node outside it.
    for (const record of scene(canvas).nodes) clampInto(canvas, record, record.dx, record.dy, true);
  }

  function clampInto(canvas, record, dx, dy, apply) {
    const stage = canvas.__stage, pad = 4, box = record.box;
    if (stage) {
      dx = Math.min(Math.max(dx, stage.x + pad - box.x), stage.x + stage.w - pad - box.w - box.x);
      dy = Math.min(Math.max(dy, stage.y + pad - box.y), stage.y + stage.h - pad - box.h - box.y);
    }
    if (apply && (dx !== record.dx || dy !== record.dy)) moveNode(canvas, record, dx, dy);
    return [dx, dy];
  }

  // Back inline, the canvas takes the size its layout needs: the drawn size,
  // or wider if a node was left outside it.
  function fitExtent(canvas) {
    const base = baseOf(canvas), pad = 16;
    let x0 = 0, y0 = 0, x1 = base.w, y1 = base.h;
    for (const record of scene(canvas).nodes) {
      const b = now(record);
      x0 = Math.min(x0, b.x - pad); y0 = Math.min(y0, b.y - pad);
      x1 = Math.max(x1, b.x + b.w + pad); y1 = Math.max(y1, b.y + b.h + pad);
    }
    const w = Math.ceil(x1 - x0), h = Math.ceil(y1 - y0);
    canvas.setAttribute("viewBox", `${x0} ${y0} ${w} ${h}`);
    canvas.__home = { x: x0, y: y0, w, h };
    canvas.setAttribute("width", w); canvas.setAttribute("height", h);
    canvas.style.maxWidth = w + "px"; canvas.style.minWidth = Math.round(w * 0.7) + "px";
  }

  function mountStage(holder) {
    if (!movable(holder)) return;
    holder.__body.classList.add("movable");
    const canvas = holder.__canvas;
    fitStage(holder);
    if (!canvas.__drag) canvas.__drag = attachDrag(canvas);
  }

  function unmountStage(holder) {
    holder.__body.classList.remove("movable");
    const canvas = holder.__canvas;
    if (canvas && canvas.__scene && !canvas.__fixed) { canvas.__stage = null; fitExtent(canvas); }
  }

  // ---- dragging: pointer events, so a mouse, a pen and a finger all work

  function attachDrag(canvas) {
    let drag = null, swallow = false;
    const point = (event) => {
      const matrix = canvas.getScreenCTM();
      return matrix ? new DOMPoint(event.clientX, event.clientY).matrixTransform(matrix.inverse()) : null;
    };
    const live = () => canvas.__stage;   // only while expanded
    canvas.addEventListener("pointerdown", (event) => {
      if (!live() || event.button !== 0) return;
      const group = event.target.closest && event.target.closest("g.node");
      const record = group && scene(canvas).nodes.find((r) => r.group === group);
      const at = point(event);
      if (!record || !at) return;
      drag = { record, id: event.pointerId, at, from: [record.dx, record.dy],
        client: [event.clientX, event.clientY], moved: false };
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      if (!drag.moved) {
        // A click that wobbles is still a click.
        if (Math.hypot(event.clientX - drag.client[0], event.clientY - drag.client[1]) < 4) return;
        drag.moved = true;
        drag.record.group.classList.add("dragging");
        // Capture only now: capturing on press would retarget the click that
        // ends a plain press, and nodes would stop answering it.
        try { canvas.setPointerCapture(drag.id); } catch (_) { /* no capture: still works */ }
      }
      const at = point(event);
      if (!at) return;
      const [dx, dy] = clampInto(canvas, drag.record, drag.from[0] + at.x - drag.at.x,
        drag.from[1] + at.y - drag.at.y, false);
      moveNode(canvas, drag.record, dx, dy);
    });
    const finish = (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      drag.record.group.classList.remove("dragging");
      // The click that follows a drag is not a request to ask about the node.
      if (drag.moved) { swallow = true; setTimeout(() => { swallow = false; }, 0); }
      drag = null;
    };
    canvas.addEventListener("pointerup", finish);
    canvas.addEventListener("pointercancel", finish);
    // Expanded, a click is not "tell me more": that message would land in a
    // conversation the frame is covering. Inline it still is.
    canvas.addEventListener("click", (event) => {
      if (!live()) return;
      if (swallow || (event.target.closest && event.target.closest("g.node"))) event.stopPropagation();
    }, true);
    return true;
  }

  // The same passages, another shape: create_visual with this visual's own
  // node ids, so a redraw cannot quietly change what it is a picture of.
  function redrawBar(holder, visual, citations) {
    const redraw = visual.redraw;
    const current = (visual.diagram || {}).kind;
    const bar = el("div", { class: "redraw" }, el("span", { class: "muted" }, "Redraw as"));
    for (const kind of redraw.kinds || Object.keys(KIND_LABELS)) {
      if (kind === current || !KIND_LABELS[kind]) continue;
      const button = el("button", { class: "pill", type: "button" }, KIND_LABELS[kind]);
      button.addEventListener("click", () => {
        for (const other of bar.querySelectorAll("button")) other.disabled = true;
        button.textContent = KIND_LABELS[kind] + "…";
        request("tools/call", { name: "create_visual", arguments: {
          knowledge_base: redraw.knowledge_base, request: redraw.request,
          node_ids: redraw.node_ids, kind,
        } }).then((result) => {
          const payload = payloadOf(result || {});
          if (!payload.visual) throw new Error((result && result.content && result.content[0]
            && result.content[0].text) || "no visual returned");
          drawVisual(holder, payload.visual, payload.citations || citations);
          reportSize();
        }).catch((error) => {
          for (const other of bar.querySelectorAll("button")) other.disabled = false;
          button.textContent = KIND_LABELS[kind];
          bar.append(el("span", { class: "declined" }, " " + (error.message || "could not redraw")));
        });
      });
      bar.append(button);
    }
    return bar;
  }

  // ---------------------------------------------------------------- shapes

  function arrowDefs() {
    const defs = svg("defs");
    const marker = svg("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 9, refY: 5,
      markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
    marker.append(svg("path", { d: "M0,0 L10,5 L0,10 z", fill: "var(--muted)" }));
    defs.append(marker);
    // UML ends: a hollow triangle (generalization, realization), filled and
    // hollow diamonds (composition, aggregation) and an open arrowhead
    // (navigable association, dependency, include/extend).
    const uml = [
      ["tri", "0 0 12 12", 11, 6, "M0,0 L12,6 L0,12 z", "var(--bg)"],
      // Diamonds sit at a path's start, where the marker is reversed: anchoring
      // the far tip keeps the diamond outside the box instead of under it.
      ["diamond", "0 0 16 10", 15, 5, "M1,5 L8,0 L15,5 L8,10 z", "var(--muted)"],
      ["diamond-open", "0 0 16 10", 15, 5, "M1,5 L8,0 L15,5 L8,10 z", "var(--bg)"],
      ["open", "0 0 10 10", 9, 5, "M0,0 L10,5 L0,10", "none"],
    ];
    for (const [id, box, refX, refY, d, fill] of uml) {
      const m = svg("marker", { id, viewBox: box, refX, refY, markerWidth: id === "tri" ? 11 : 12,
        markerHeight: 11, orient: "auto-start-reverse", markerUnits: "userSpaceOnUse" });
      m.append(svg("path", { d, fill, stroke: "var(--muted)", "stroke-width": 1.2 }));
      defs.append(m);
    }
    return defs;
  }

  function canvasOf(width, height, title) {
    const canvas = svg("svg", { width, height, viewBox: `0 0 ${width} ${height}`, role: "img",
      "aria-label": title || "diagram" });
    // Fit the frame, but never below 70% of the drawn size: past that the
    // labels stop being readable, and scrolling a wide diagram beats squinting.
    canvas.style.maxWidth = width + "px";
    canvas.style.minWidth = Math.round(width * 0.7) + "px";
    canvas.append(arrowDefs());
    return canvas;
  }

  function wrap(label, max) {
    max = max || 22;
    const words = String(label || "").split(/\s+/);
    const lines = [];
    let line = "";
    for (const word of words) {
      if (line && (line + " " + word).length > max) { lines.push(line); line = word; }
      else line = line ? line + " " + word : word;
    }
    if (line) lines.push(line);
    if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].replace(/.{0,2}$/, "…"); }
    return lines;
  }

  function sizeOf(node) {
    const lines = wrap(node.label);
    let w = Math.min(210, Math.max(84, 7 * Math.max(...lines.map((l) => l.length)) + 30));
    let h = 20 + lines.length * 15;
    const shape = node.shape || "box";
    if (shape === "circle") { w = h = Math.max(w * 0.9, h + 24); }
    else if (shape === "ellipse") { w += 24; h += 14; }
    else if (shape === "diamond") { w *= 1.25; h *= 1.6; }
    else if (shape === "hexagon") { w += 20; }
    else if (shape === "cylinder") { h += 12; }
    return { w: Math.round(w), h: Math.round(h), lines };
  }

  function shapeOf(kind, box) {
    const { x, y, w, h } = box;
    const cx = x + w / 2, cy = y + h / 2;
    switch (kind) {
      case "round": return svg("rect", { x, y, width: w, height: h, rx: 12 });
      case "pill": return svg("rect", { x, y, width: w, height: h, rx: h / 2 });
      case "ellipse": return svg("ellipse", { cx, cy, rx: w / 2, ry: h / 2 });
      case "circle": return svg("circle", { cx, cy, r: Math.min(w, h) / 2 });
      case "diamond": return svg("polygon", { points: `${cx},${y} ${x + w},${cy} ${cx},${y + h} ${x},${cy}` });
      case "hexagon": return svg("polygon", { points:
        `${x + 14},${y} ${x + w - 14},${y} ${x + w},${cy} ${x + w - 14},${y + h} ${x + 14},${y + h} ${x},${cy}` });
      case "cylinder": return svg("path", { d:
        `M${x},${y + 7} a${w / 2},7 0 0,0 ${w},0 a${w / 2},7 0 0,0 ${-w},0 v${h - 14} ` +
        `a${w / 2},7 0 0,0 ${w},0 v${-(h - 14)}` });
      case "note": return svg("path", { d:
        `M${x},${y} h${w - 12} l12,12 v${h - 12} h${-w} z` });
      default: return svg("rect", { x, y, width: w, height: h, rx: 6 });
    }
  }

  // One node: its shape, its wrapped label, its citations, a tooltip, and a
  // click that asks the conversation to go deeper (the host decides).
  function drawNode(canvas, node, box, lines) {
    const group = svg("g", { class: "node" + (node.inferred ? " inferred" : "") });
    box.shape = node.shape;
    group.append(shapeOf(node.shape, box));
    lines = lines || wrap(node.label);
    const top = box.y + box.h / 2 - (lines.length - 1) * 7.5 + 4;
    lines.forEach((line, i) => {
      const text = svg("text", { x: box.x + box.w / 2, y: top + i * 15, "text-anchor": "middle" });
      text.textContent = line;
      group.append(text);
    });
    if (node.cites && node.cites.length && box.w >= 60) {
      const cite = svg("text", { class: "cite", x: box.x + box.w - 3, y: box.y + 10, "text-anchor": "end" });
      cite.textContent = node.cites.map((n) => `[${n}]`).join("");
      group.append(cite);
    }
    const title = svg("title");
    title.textContent = (node.inferred ? `${node.label} (not cited)` : `${node.label} — sources ${node.cites.join(", ")}`)
      + (node.detail ? `\n${node.detail}` : "");
    group.append(title);
    group.style.cursor = "pointer";
    group.addEventListener("click", () => request("ui/message", {
      role: "user", content: { type: "text", text: `Tell me more about ${node.label}` },
    }).catch(() => {}));
    canvas.append(group);
    track(canvas, group, box);
    return group;
  }

  // Where the straight line between two box centres leaves shape ``a``.
  function border(a, b) {
    const ax = a.x + a.w / 2, ay = a.y + a.h / 2, bx = b.x + b.w / 2, by = b.y + b.h / 2;
    const dx = bx - ax, dy = by - ay;
    if (!dx && !dy) return [ax, ay];
    const rx = a.w / 2, ry = a.h / 2;
    let scale;
    if (a.shape === "ellipse" || a.shape === "circle") {
      const r = a.shape === "circle" ? Math.min(rx, ry) : null;
      scale = 1 / Math.sqrt((dx / (r || rx)) ** 2 + (dy / (r || ry)) ** 2);
    } else if (a.shape === "diamond") {
      scale = 1 / (Math.abs(dx) / rx + Math.abs(dy) / ry);
    } else {
      scale = Math.min(Math.abs(rx / (dx || 1e-9)), Math.abs(ry / (dy || 1e-9)));
    }
    return [ax + dx * scale, ay + dy * scale];
  }

  function drawEdge(canvas, edge, a, b, options) {
    options = options || {};
    const group = svg("g", { class: "edge" + (edge.inferred ? " inferred" : "") });
    let d, mx, my;
    if (options.path) { [d, mx, my] = options.path; }
    else {
      const [x1, y1] = border(a, b), [x2, y2] = border(b, a);
      d = `M${x1},${y1} L${x2},${y2}`; mx = (x1 + x2) / 2; my = (y1 + y2) / 2;
    }
    const line = svg("path", { d, "marker-end": options.arrow === false ? "" : "url(#arrow)" });
    group.append(line);
    let text = null;
    if (edge.label) {
      // On top of everything, with a halo: a label a box covers is a claim
      // nobody can read.
      text = svg("text", { class: "edge-label", x: mx, y: my - 5, "text-anchor": "middle" });
      text.textContent = edge.label;
      canvas.append(text);
    }
    const title = svg("title");
    title.textContent = edge.inferred ? "not cited" : `sources ${(edge.cites || []).join(", ")}`;
    group.append(title);
    // Under the nodes, over everything else (lane bands included).
    canvas.insertBefore(group, canvas.querySelector("g.node"));
    trackEdge(canvas, { group, line, text, a, b, d, mx, my });
    return group;
  }

  function fit(boxes, pad) {
    pad = pad === undefined ? 16 : pad;
    return {
      w: Math.ceil(Math.max(...boxes.map((b) => b.x + b.w)) + pad),
      h: Math.ceil(Math.max(...boxes.map((b) => b.y + b.h)) + pad),
    };
  }

  // Longest-path ranks over the forward edges: a process reads in order.
  // Deterministic — node order breaks every tie.
  function ranks(diagram) {
    const nodes = diagram.nodes;
    const index = new Map(nodes.map((node, i) => [node.id, i]));
    const rank = new Map(nodes.map((node) => [node.id, 0]));
    const forward = diagram.edges.filter((edge) => index.get(edge.from) < index.get(edge.to));
    for (let pass = 0; pass < nodes.length; pass++) {
      let changed = false;
      for (const edge of forward) {
        if (rank.get(edge.to) < rank.get(edge.from) + 1) { rank.set(edge.to, rank.get(edge.from) + 1); changed = true; }
      }
      if (!changed) break;
    }
    return rank;
  }

  function layeredSvg(diagram, horizontal) {
    const rank = ranks(diagram);
    const layers = [];
    for (const node of diagram.nodes) (layers[rank.get(node.id)] ||= []).push(node);
    const gapMain = horizontal ? 48 : 52, gapCross = 22;
    const pos = new Map(), sizes = new Map(diagram.nodes.map((n) => [n.id, sizeOf(n)]));
    let main = 16;
    const extent = [];
    for (const layer of layers) {
      if (!layer) continue;
      let cross = 0, widest = 0;
      for (const node of layer) {
        const size = sizes.get(node.id);
        widest = Math.max(widest, horizontal ? size.w : size.h);
        cross += (horizontal ? size.h : size.w) + gapCross;
      }
      extent.push(cross);
      let at = 16;
      for (const node of layer) {
        const size = sizes.get(node.id);
        pos.set(node.id, horizontal
          ? { x: main + (widest - size.w) / 2, y: at, w: size.w, h: size.h }
          : { x: at, y: main + (widest - size.h) / 2, w: size.w, h: size.h });
        at += (horizontal ? size.h : size.w) + gapCross;
      }
      main += widest + gapMain;
    }
    // Centre each layer across the widest one, so a tree reads as a tree.
    const widestLayer = Math.max(...extent);
    let li = 0;
    for (const layer of layers) {
      if (!layer) continue;
      const shift = (widestLayer - extent[li++]) / 2;
      for (const node of layer) { const b = pos.get(node.id); if (horizontal) b.y += shift; else b.x += shift; }
    }
    const size = fit([...pos.values()]);
    const canvas = canvasOf(size.w, size.h, diagram.title);
    for (const node of diagram.nodes) drawNode(canvas, node, pos.get(node.id), sizes.get(node.id).lines);
    for (const edge of diagram.edges) {
      const a = pos.get(edge.from), b = pos.get(edge.to);
      if (!a || !b) continue;
      const back = rank.get(edge.to) <= rank.get(edge.from);
      if (back) { drawEdge(canvas, edge, a, b); continue; }
      const [x1, y1, x2, y2] = horizontal
        ? [a.x + a.w, a.y + a.h / 2, b.x, b.y + b.h / 2]
        : [a.x + a.w / 2, a.y + a.h, b.x + b.w / 2, b.y];
      const bend = horizontal ? `C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2}`
        : `C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2}`;
      drawEdge(canvas, edge, a, b, { path: [`M${x1},${y1} ${bend} ${x2},${y2}`, (x1 + x2) / 2, (y1 + y2) / 2] });
    }
    return canvas;
  }

  // Left to right reads best, until it does not fit: a flow too wide for the
  // frame at a readable scale turns top-down rather than scrolling sideways.
  function flowSvg(diagram) {
    const across = layeredSvg(diagram, true);
    const room = Math.max(320, root.clientWidth - 8);
    return Number(across.getAttribute("width")) * 0.7 > room ? layeredSvg(diagram, false) : across;
  }

  function sequenceSvg(diagram) {
    const lane = 160, top = 20, step = 38;
    const nodes = diagram.nodes;
    const x = new Map(nodes.map((node, i) => [node.id, 20 + i * lane + lane / 2]));
    const width = 40 + nodes.length * lane;
    const height = top + 60 + diagram.edges.length * step + 20;
    const canvas = canvasOf(width, height, diagram.title);
    canvas.__fixed = true;   // participants sit on their lifelines
    for (const node of nodes) {
      const cx = x.get(node.id), size = sizeOf(node);
      canvas.append(svg("line", { class: "lifeline", x1: cx, y1: top + size.h, x2: cx, y2: height - 10 }));
      drawNode(canvas, node, { x: cx - size.w / 2, y: top, w: size.w, h: size.h }, size.lines);
    }
    diagram.edges.forEach((edge, i) => {
      const y = top + 76 + i * step, x1 = x.get(edge.from), x2 = x.get(edge.to);
      const labelled = { ...edge, label: `${i + 1}. ${edge.label || ""}` + (edge.cites.length ? ` [${edge.cites.join("][")}]` : "") };
      drawEdge(canvas, labelled, null, null, { path: [`M${x1},${y} L${x2},${y}`, (x1 + x2) / 2, y] });
    });
    return canvas;
  }

  function treeOf(diagram) {
    const nodes = diagram.nodes;
    const children = new Map(nodes.map((n) => [n.id, []]));
    const parent = new Map();
    for (const edge of diagram.edges) {
      if (edge.to === nodes[0].id || parent.has(edge.to)) continue;
      parent.set(edge.to, edge.from);
      children.get(edge.from).push(edge.to);
    }
    // Anything unreached hangs off the root, rather than off the page.
    const seen = new Set([nodes[0].id]);
    const stack = [nodes[0].id];
    while (stack.length) for (const c of children.get(stack.pop())) if (!seen.has(c)) { seen.add(c); stack.push(c); }
    for (const n of nodes) if (!seen.has(n.id)) { children.get(nodes[0].id).push(n.id); parent.set(n.id, nodes[0].id); seen.add(n.id); }
    return { children, parent };
  }

  function mindmapSvg(diagram) {
    const nodes = diagram.nodes, byId = new Map(nodes.map((n) => [n.id, n]));
    const { children } = treeOf(diagram);
    const leaves = new Map();
    const count = (id, guard) => {
      if (guard.has(id)) return 1; guard.add(id);
      const kids = children.get(id) || [];
      const total = kids.length ? kids.reduce((sum, k) => sum + count(k, guard), 0) : 1;
      leaves.set(id, total);
      return total;
    };
    count(nodes[0].id, new Set());
    const center = new Map([[nodes[0].id, [0, 0]]]);
    const place = (id, from, to, depth) => {
      let at = from;
      for (const kid of children.get(id) || []) {
        if (center.has(kid)) continue;
        const span = (to - from) * (leaves.get(kid) || 1) / (leaves.get(id) || 1);
        const angle = at + span / 2, radius = 170 * depth;
        center.set(kid, [Math.cos(angle) * radius, Math.sin(angle) * radius * 0.72]);
        place(kid, at, at + span, depth + 1);
        at += span;
      }
    };
    place(nodes[0].id, -Math.PI / 2, Math.PI * 1.5, 1);
    const sizes = new Map(nodes.map((n) => [n.id, sizeOf({ ...n, shape: n.shape || (n === nodes[0] ? "ellipse" : "pill") })]));
    let boxes = nodes.map((n) => { const [x, y] = center.get(n.id); const s = sizes.get(n.id); return [n.id, { x: x - s.w / 2, y: y - s.h / 2, w: s.w, h: s.h }]; });
    const minX = Math.min(...boxes.map(([, b]) => b.x)), minY = Math.min(...boxes.map(([, b]) => b.y));
    const pos = new Map(boxes.map(([id, b]) => [id, { ...b, x: b.x - minX + 16, y: b.y - minY + 16 }]));
    const size = fit([...pos.values()]);
    const canvas = canvasOf(size.w, size.h, diagram.title);
    for (const n of nodes) drawNode(canvas, { ...n, shape: n.shape || (n === nodes[0] ? "ellipse" : "pill") }, pos.get(n.id), sizes.get(n.id).lines);
    for (const edge of diagram.edges) {
      const a = pos.get(edge.from), b = pos.get(edge.to);
      if (a && b) drawEdge(canvas, edge, a, b, { arrow: false });
    }
    for (const [kid, list] of children) for (const c of list) {
      if (!diagram.edges.some((e) => e.from === kid && e.to === c)) drawEdge(canvas, { inferred: false, cites: [] }, pos.get(kid), pos.get(c), { arrow: false });
    }
    return canvas;
  }

  // A deterministic force layout: nodes start on a circle and settle, the
  // same way on every render, so a concept map does not move between views.
  function conceptSvg(diagram) {
    const nodes = diagram.nodes, n = nodes.length;
    const sizes = new Map(nodes.map((node) => [node.id, sizeOf(node)]));
    const area = Math.max(360, 120 * Math.sqrt(n)) ** 2 * 1.4, k = Math.sqrt(area / n);
    const p = nodes.map((_, i) => [Math.cos(2 * Math.PI * i / n) * k, Math.sin(2 * Math.PI * i / n) * k]);
    const index = new Map(nodes.map((node, i) => [node.id, i]));
    // Start cool: a step longer than the distance to equilibrium overshoots it,
    // and two linked nodes cross over onto the very same point and stay there
    // (no direction is left to push them apart).
    let temperature = k / 4;
    for (let step = 0; step < 300; step++) {
      const force = p.map(() => [0, 0]);
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
        const dx = p[i][0] - p[j][0], dy = p[i][1] - p[j][1], d = Math.max(1, Math.hypot(dx, dy));
        const f = k * k / d;
        force[i][0] += dx / d * f; force[i][1] += dy / d * f;
        force[j][0] -= dx / d * f; force[j][1] -= dy / d * f;
      }
      for (const edge of diagram.edges) {
        const i = index.get(edge.from), j = index.get(edge.to);
        const dx = p[i][0] - p[j][0], dy = p[i][1] - p[j][1], d = Math.max(1, Math.hypot(dx, dy));
        const f = d * d / k;
        force[i][0] -= dx / d * f; force[i][1] -= dy / d * f;
        force[j][0] += dx / d * f; force[j][1] += dy / d * f;
      }
      for (let i = 0; i < n; i++) {
        const d = Math.max(1, Math.hypot(force[i][0], force[i][1]));
        p[i][0] += force[i][0] / d * Math.min(d, temperature);
        p[i][1] += force[i][1] / d * Math.min(d, temperature);
      }
      temperature *= 0.985;
    }
    // Stretch the settled layout into a readable box, each axis on its own:
    // a chain settles into a thin diagonal, which at its natural extent is
    // either a long scroll or, fitted to the frame, text too small to read.
    const xs = p.map((q) => q[0]), ys = p.map((q) => q[1]);
    const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    const boxW = Math.max(520, 150 * Math.sqrt(n) * 1.5), boxH = Math.max(300, boxW * 0.55);
    const pos = new Map(nodes.map((node, i) => {
      const s = sizes.get(node.id);
      const cx = 16 + 110 + (x1 > x0 ? (p[i][0] - x0) / (x1 - x0) : 0.5) * boxW;
      const cy = 16 + 30 + (y1 > y0 ? (p[i][1] - y0) / (y1 - y0) : 0.5) * boxH;
      return [node.id, { x: cx - s.w / 2, y: cy - s.h / 2, w: s.w, h: s.h }];
    }));
    const size = fit([...pos.values()]);
    const canvas = canvasOf(size.w, size.h, diagram.title);
    for (const node of nodes) drawNode(canvas, node, pos.get(node.id), sizes.get(node.id).lines);
    for (const edge of diagram.edges) drawEdge(canvas, edge, pos.get(edge.from), pos.get(edge.to));
    return canvas;
  }

  function cycleSvg(diagram) {
    const nodes = diagram.nodes, n = nodes.length;
    const sizes = nodes.map((node) => sizeOf({ ...node, shape: node.shape || "round" }));
    const radius = Math.max(130, n * 42);
    const centre = radius + Math.max(...sizes.map((s) => s.w)) / 2 + 16;
    const pos = new Map(nodes.map((node, i) => {
      const angle = -Math.PI / 2 + 2 * Math.PI * i / n;
      const s = sizes[i];
      return [node.id, { x: centre + Math.cos(angle) * radius - s.w / 2, y: centre * 0.85 + Math.sin(angle) * radius * 0.8 - s.h / 2, w: s.w, h: s.h }];
    }));
    const size = fit([...pos.values()]);
    const canvas = canvasOf(size.w, size.h, diagram.title);
    nodes.forEach((node, i) => drawNode(canvas, { ...node, shape: node.shape || "round" }, pos.get(node.id), sizes[i].lines));
    const edges = diagram.edges.length ? diagram.edges
      : nodes.map((node, i) => ({ from: node.id, to: nodes[(i + 1) % n].id, label: "", cites: [], inferred: false }));
    for (const edge of edges) {
      const a = pos.get(edge.from), b = pos.get(edge.to);
      const [x1, y1] = border(a, b), [x2, y2] = border(b, a);
      const cx = (x1 + x2) / 2 + ((x1 + x2) / 2 - centre) * 0.25, cy = (y1 + y2) / 2 + ((y1 + y2) / 2 - centre * 0.85) * 0.25;
      drawEdge(canvas, edge, a, b, { path: [`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`, cx, cy] });
    }
    return canvas;
  }

  function timelineSvg(diagram) {
    const nodes = diagram.nodes;
    const sizes = nodes.map((node) => sizeOf(node));
    const step = Math.max(150, ...sizes.map((s) => s.w + 18));
    const width = 40 + step * nodes.length, axis = 150, height = 300;
    const canvas = canvasOf(width, height, diagram.title);
    canvas.__fixed = true;   // events sit on the axis
    canvas.append(svg("line", { class: "axis", x1: 16, y1: axis, x2: width - 16, y2: axis, "marker-end": "url(#arrow)" }));
    nodes.forEach((node, i) => {
      const cx = 20 + step * i + step / 2, above = i % 2 === 0, s = sizes[i];
      canvas.append(svg("circle", { class: "marker" + (node.inferred ? " inferred" : ""), cx, cy: axis, r: 6 }));
      const box = { x: cx - s.w / 2, y: above ? axis - 34 - s.h : axis + 34, w: s.w, h: s.h };
      canvas.append(svg("line", { class: "tick", x1: cx, y1: axis, x2: cx, y2: above ? box.y + box.h : box.y }));
      drawNode(canvas, node, box, s.lines);
      if (node.when) {
        const when = svg("text", { class: "when", x: cx, y: above ? axis + 20 : axis - 12, "text-anchor": "middle" });
        when.textContent = node.when;
        canvas.append(when);
      }
    });
    return canvas;
  }

  function lanesOf(diagram) {
    const lanes = (diagram.groups || []).map((g) => ({ ...g }));
    const known = new Set(lanes.map((g) => g.id));
    for (const node of diagram.nodes) {
      const id = node.group || "";
      if (!known.has(id)) { known.add(id); lanes.push({ id, label: id || "Other", cites: [], inferred: false, implicit: true }); }
    }
    return lanes.filter((lane) => diagram.nodes.some((n) => (n.group || "") === lane.id));
  }

  function bandLabel(canvas, lane, x, y, w, h) {
    canvas.append(svg("rect", { class: "band" + (lane.inferred && !lane.implicit ? " inferred" : ""), x, y, width: w, height: h, rx: 6 }));
    const text = svg("text", { class: "band-label", x: x + 10, y: y + 18 });
    text.textContent = lane.label + (lane.cites && lane.cites.length ? ` [${lane.cites.join("][")}]` : "");
    canvas.append(text);
  }

  function swimlaneSvg(diagram) {
    const lanes = lanesOf(diagram), rank = ranks(diagram);
    const sizes = new Map(diagram.nodes.map((n) => [n.id, sizeOf(n)]));
    // Lane names sit inside their bands, above the nodes, so the lanes need
    // no label column of their own.
    const column = Math.max(...[...sizes.values()].map((s) => s.w)) + 44, labelWidth = 20;
    const pos = new Map();
    let y = 12;
    const bands = [];
    for (const lane of lanes) {
      const members = diagram.nodes.filter((n) => (n.group || "") === lane.id);
      const stacks = new Map();
      let tallest = 0;
      for (const node of members) {
        const r = rank.get(node.id), s = sizes.get(node.id), at = stacks.get(r) || 0;
        pos.set(node.id, { x: labelWidth + r * column + (column - 44 - s.w) / 2, y: y + 30 + at, w: s.w, h: s.h });
        stacks.set(r, at + s.h + 14);
        tallest = Math.max(tallest, at + s.h);
      }
      bands.push([lane, y, tallest + 46]);
      y += tallest + 58;
    }
    const width = labelWidth + (Math.max(...[...rank.values()]) + 1) * column;
    const canvas = canvasOf(width, y, diagram.title);
    for (const [lane, top, h] of bands) bandLabel(canvas, lane, 6, top, width - 12, h);
    for (const node of diagram.nodes) drawNode(canvas, node, pos.get(node.id), sizes.get(node.id).lines);
    for (const edge of diagram.edges) drawEdge(canvas, edge, pos.get(edge.from), pos.get(edge.to));
    return canvas;
  }

  function layersSvg(diagram) {
    const lanes = lanesOf(diagram), width = 720;
    const sizes = new Map(diagram.nodes.map((n) => [n.id, sizeOf(n)]));
    const pos = new Map();
    let y = 10;
    const bands = [];
    for (const lane of lanes) {
      const members = diagram.nodes.filter((n) => (n.group || "") === lane.id);
      let x = 170, rowTop = y + 12, rowHeight = 0;
      for (const node of members) {
        const s = sizes.get(node.id);
        if (x + s.w > width - 16) { x = 170; rowTop += rowHeight + 12; rowHeight = 0; }
        pos.set(node.id, { x, y: rowTop, w: s.w, h: s.h });
        x += s.w + 14; rowHeight = Math.max(rowHeight, s.h);
      }
      const h = rowTop + rowHeight + 12 - y;
      bands.push([lane, y, h]);
      y += h + 8;
